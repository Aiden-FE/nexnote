name: Tauri Release (candidate)

# DEV-124 Tauri candidate build. Deliberately separate from the controlled
# Electron release pipeline (release.yml): until DEV-125 retires Electron,
# release.yml remains the production publish path and this workflow only
# produces signed-when-possible candidate artifacts for manual QA.
# Manual dispatch only — Tauri artifacts are not part of the published
# release contract yet, and an accidental tag push must not publish them.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit / branch / tag to build (defaults to current HEAD)
        required: false
        type: string

permissions:
  contents: read

# Actions are pinned to the same SHAs release.yml already pins (v7 checkout,
# pnpm 6.1.0, node 7.0.0, upload-artifact v7.0.1) so no new trust roots are
# introduced. The Rust toolchain comes from the runners' preinstalled rustup.
# macOS bundles are re-signed ad hoc after `tauri build`: the linker-signed
# binary inside the bundle does not seal bundle resources, so the default
# output fails `codesign --verify` (reproduced locally and fixed by re-sign).

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: tauri-macos-arm64
          - os: macos-15-intel
            artifact: tauri-macos-x64
          - os: windows-2022
            artifact: tauri-windows-x64
          - os: ubuntu-24.04
            artifact: tauri-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - name: Install Rust toolchain (host target)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev xvfb xdotool x11-utils
      - run: pnpm install --frozen-lockfile
      - name: Verify package.json / tauri.conf.json / Cargo.toml version parity
        shell: bash
        # GITHUB_REF_NAME is a branch name on candidate builds; the script
        # would treat it as a release tag and fail. The three-way parity
        # check is what this gate exists for.
        run: env -u GITHUB_REF_NAME node scripts/check-version.mjs
      - name: Configure Git identity for repository fixtures
        shell: bash
        run: |
          git config --global user.name "NexNote CI"
          git config --global user.email "ci@nexnote.invalid"
          git config --global core.autocrlf false
      - name: Build Tauri app (signed updater metadata when credentials exist)
        shell: bash
        env:
          # Optional: without the updater signing key the build still succeeds
          # and produces unsigned candidate artifacts without .sig files; the
          # app then registers no updater plugin (verified gate in src-tauri).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Tauri updater signing key unavailable; building unsigned candidates.'
          fi
          pnpm tauri build
      - name: Re-sign and verify macOS bundle (ad hoc)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name 'NexNote.app' -print -quit)
          test -n "$app" || { echo '::error::no NexNote.app bundle produced'; exit 1; }
          # tauri build leaves the linker-signed binary inside a freshly
          # assembled bundle; the bundle signature must seal resources too.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Signature=adhoc'
      - name: Smoke-launch the re-signed macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name 'NexNote.app' -print -quit)
          open "$app"
          sleep 12
          # The process name is the executable (nexnote-tauri), not the bundle
          # display name; 'contains' keeps this resilient to renames.
          windows=$(osascript -e 'tell application "System Events" to tell first process whose name contains "exnote" to return count of windows' 2>&1)
          echo "window count: $windows"
          pkill -f 'NexNote.app' || true
          case "$windows" in
            ''|*[!0-9]*) echo '::error::packaged app did not report a window count'; exit 1 ;;
            0) echo '::error::packaged app launched with no windows'; exit 1 ;;
            *) echo "packaged smoke OK ($windows window(s))" ;;
          esac
      - name: Verify Windows bundle output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi -Filter '*.msi' -ErrorAction SilentlyContinue
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' -ErrorAction SilentlyContinue
          if (-not $msi -and -not $nsis) { throw 'no Windows installer produced' }
          foreach ($artifact in @($msi) + @($nsis)) {
            if ($artifact) { Write-Host "produced: $($artifact.Name)" }
          }

      - name: Smoke-launch on Windows (WebView2)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/nexnote-tauri.exe'
          if (-not (Test-Path $exe)) { throw "built binary missing: $exe" }
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) { throw "app exited during smoke (code $($proc.ExitCode))" }
          $proc.Refresh()
          # MainWindowHandle != 0 means the main WebView window was created.
          if ($proc.MainWindowHandle -eq [IntPtr]::Zero) {
            Stop-Process -Id $proc.Id -ErrorAction SilentlyContinue
            throw 'app is running but created no main window (WebView2 load failed?)'
          }
          Write-Host "Windows smoke OK: main window handle $($proc.MainWindowHandle)"
          Stop-Process -Id $proc.Id -ErrorAction SilentlyContinue
      - name: Verify Linux bundle output
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          ((${#debs[@]} || ${#appimages[@]})) || { echo '::error::no Linux distributable produced'; exit 1; }
          for artifact in "${debs[@]}" "${appimages[@]}"; do echo "produced: $(basename "$artifact")"; done

      - name: Smoke-launch on Linux (WebKitGTK under xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          exe=src-tauri/target/release/nexnote-tauri
          test -x "$exe" || { echo "::error::built binary missing: $exe"; exit 1; }
          # Software rendering + no compositor: the reliable WebKitGTK mode
          # on headless runners.
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a bash -c '
            "$0" &
            app=$!
            sleep 20
            kill -0 "$app" || { echo "::error::app exited during smoke"; exit 1; }
            # Bare xvfb has no window manager, so windows can stay unmapped —
            # search without --onlyvisible, by window name and by WM class
            # (binary name and bundle identifier both count).
            { xdotool search --name "NexNote" || true
              xdotool search --class "nexnote" || true
              xdotool search --class "dev.nexnote.desktop" || true
            } | sort -u > /tmp/nexnote-windows.txt
            windows=$(wc -l < /tmp/nexnote-windows.txt)
            echo "window candidates: $windows"
            if [ "$windows" -eq 0 ]; then
              echo "::error::app is running but no NexNote window exists (WebKitGTK load failed?)"
              echo "::error::X window tree follows for diagnosis"
              xwininfo -root -tree || true
              exit 1
            fi
            echo "Linux smoke OK ($windows window candidate(s))"
            kill "$app" 2>/dev/null
          ' "$exe"
      - name: Stage bundle artifacts for upload
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/tauri-stage"
          mkdir -p "$stage"
          # Only finished bundles (dmg/msi/nsis/deb/AppImage) plus updater
          # metadata — never the unpacked app trees.
          find src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' \
               -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.sig' \
               -o -name 'latest*.yml' \) \
            -exec cp '{}' "$stage/" \;
          ls -la "$stage"
          if [ -z "$(find "$stage" -maxdepth 1 -type f -print -quit)" ]; then
            echo '::error::no bundle artifacts staged'
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexnote-${{ matrix.artifact }}
          path: ${{ runner.temp }}/tauri-stage
          if-no-files-found: error
