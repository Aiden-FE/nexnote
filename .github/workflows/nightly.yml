name: Nightly build

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      NEXNOTE_UPDATE_CHANNEL: alpha
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Nightlies are internal, Ad hoc-signed, non-publishable artifacts; public release uses the same strategy.
    steps:
      # Immutable pins are maintained by Dependabot (.github/dependabot.yml).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with: { version: 10 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Restore and verify bundled Git payload
        run: |
          pnpm rebuild dugite
          node scripts/verify-bundled-git.mjs --install-tree .
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm dist:mac -- --arm64 --publish never
        env:
          ELECTRON_NO_ASAR: '1'
      - name: Verify packaged bundled Git
        run: node scripts/verify-bundled-git.mjs --app release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexnote-nightly-macos
          path: release/*
          retention-days: 14
