name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, beta, alpha]

# Default read-only token. Only the final, serialized publication job can write Releases.
permissions:
  contents: read

# One repository-wide lock prevents distinct tags/refs from publishing concurrently.
# Do not add ref/channel expressions here: any differing value would permit a release race.
concurrency:
  group: nexnote-public-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.value }}
    steps:
      # Pinned action SHAs are maintained by Dependabot (.github/dependabot.yml).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "value=${{ inputs.channel }}" >> "$GITHUB_OUTPUT";
          elif [[ "${{ github.ref_name }}" == *"-alpha"* ]]; then echo "value=alpha" >> "$GITHUB_OUTPUT";
          elif [[ "${{ github.ref_name }}" == *"-beta"* ]]; then echo "value=beta" >> "$GITHUB_OUTPUT";
          else echo "value=stable" >> "$GITHUB_OUTPUT"; fi

  # Native package/sign jobs never publish. Secrets are scoped only to the platform
  # command that consumes them; missing credentials are an error, never a skip.
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac --arm64
            artifact: macos-arm64
          - os: macos-13
            target: --mac --x64
            artifact: macos-x64
          - os: windows-2022
            target: --win --x64
            artifact: windows-x64
          - os: ubuntu-22.04
            target: --linux --x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NEXNOTE_UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm verify:release-config && pnpm version:check
      - run: pnpm build

      - name: Package signed and notarized macOS distributables
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$MACOS_CERTIFICATE" && test -n "$MACOS_CERTIFICATE_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo '::error::macOS signing and notarization credentials are required'; exit 1; }
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/nexnote.p12"
          export CSC_LINK="$RUNNER_TEMP/nexnote.p12"
          export CSC_KEY_PASSWORD="$MACOS_CERTIFICATE_PASSWORD"
          node scripts/run-builder.mjs ${{ matrix.target }} --publish never

      - name: Package signed Windows distributables
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'Windows Authenticode certificate and password are required' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/nexnote.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $env:CSC_LINK = "$env:RUNNER_TEMP/nexnote.pfx"
          $env:CSC_KEY_PASSWORD = $env:WINDOWS_CERTIFICATE_PASSWORD
          node scripts/run-builder.mjs ${{ matrix.target }} --publish never

      - name: Package Linux distributables
        if: runner.os == 'Linux'
        run: node scripts/run-builder.mjs ${{ matrix.target }} --publish never

      - name: Verify macOS signature and notarization staple
        if: runner.os == 'macOS'
        run: |
          app=$(find release -maxdepth 3 -name 'NexNote.app' -print -quit)
          test -n "$app" || { echo '::error::no NexNote.app produced'; exit 1; }
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Verify Windows Authenticode signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executables = Get-ChildItem release -Filter '*.exe'
          if (-not $executables) { throw 'no .exe produced' }
          foreach ($artifact in $executables) {
            $sig = Get-AuthenticodeSignature $artifact.FullName
            if ($sig.Status -ne 'Valid') { throw "Not Authenticode-signed: $($artifact.Name) ($($sig.Status))" }
          }

      - name: Sign and verify Linux release artifacts before upload
        if: runner.os == 'Linux'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        run: |
          test -n "$LINUX_GPG_PRIVATE_KEY" || { echo '::error::Linux GPG private key is required'; exit 1; }
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/nexnote.gpg"
          gpg --batch --import "$RUNNER_TEMP/nexnote.gpg"
          shopt -s nullglob
          artifacts=(release/*.AppImage release/*.deb)
          ((${#artifacts[@]})) || { echo '::error::no Linux distributables produced'; exit 1; }
          for artifact in "${artifacts[@]}"; do
            gpg --batch --yes --armor --detach-sign "$artifact"
            gpg --verify "$artifact.asc" "$artifact"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexnote-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  # The signed macOS artifact is tested before manual QA approval or public publication.
  smoke:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nexnote-macos-arm64
          path: release
      - name: Extract packaged app for smoke
        run: |
          archive=$(find release -name '*arm64-mac.zip' -print -quit)
          test -n "$archive" || { echo '::error::macOS zip missing'; exit 1; }
          unzip -q "$archive" -d release/smoke-app
      - run: pnpm smoke:ci
        env:
          NEXNOTE_APP_PATH: release/smoke-app/NexNote.app/Contents/MacOS/NexNote

  # Repository admins must configure the `release-qa` Environment with required reviewers.
  # Approval must include the completed QA checklist evidence before this sole public publisher runs.
  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: release-qa
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nexnote-*
          path: release
          merge-multiple: true
      - name: Preflight complete signed release set
        run: |
          shopt -s nullglob
          appimages=(release/*.AppImage)
          debs=(release/*.deb)
          maczips=(release/*-mac.zip)
          macdmg=(release/*.dmg)
          windows=(release/*.exe)
          ((${#appimages[@]} && ${#debs[@]} && ${#maczips[@]} && ${#macdmg[@]} && ${#windows[@]})) || { echo '::error::incomplete cross-platform artifact set'; exit 1; }
          for artifact in "${appimages[@]}" "${debs[@]}"; do test -f "$artifact.asc" || { echo "::error::missing GPG signature for $artifact"; exit 1; }; done
      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/**/*
          generate_release_notes: true
