name: PR checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: lint-test-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validate release configuration
        run: pnpm verify:release-config
      - name: Build unpacked Linux application
        run: node scripts/run-builder.mjs --linux --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_NO_ASAR: "1"
