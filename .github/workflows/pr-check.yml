name: PR checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: lint-test-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Immutable pins are maintained by Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore and verify bundled Git payload
        run: |
          pnpm rebuild dugite
          node scripts/verify-bundled-git.mjs --install-tree .
      - name: Check formatting of changed files
        run: scripts/check-changed-format.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build static product website
        run: pnpm --filter website build
      - name: Validate release configuration
        run: pnpm verify:release-config
      - name: Build unpacked Linux application
        run: node scripts/run-builder.mjs --linux --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_NO_ASAR: '1'
      - name: Verify packaged bundled Git
        run: node scripts/verify-bundled-git.mjs --app release/linux-unpacked
