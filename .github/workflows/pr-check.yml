name: PR checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: lint-test-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Immutable pins are maintained by Dependabot.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore and verify bundled Git payload
        run: |
          pnpm rebuild dugite
          node scripts/verify-bundled-git.mjs --install-tree .
      - name: Check formatting of changed files
        run: scripts/check-changed-format.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validate release configuration
        run: pnpm verify:release-config
      - name: Build unpacked Linux application
        run: node scripts/run-builder.mjs --linux --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_NO_ASAR: '1'
      - name: Verify packaged bundled Git
        run: node scripts/verify-bundled-git.mjs --app release/linux-unpacked
