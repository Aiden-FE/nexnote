name: PR checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: lint-test-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Immutable pins are maintained by Dependabot.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting of changed files
        run: |
          set -euo pipefail
          base="${GITHUB_BASE_REF:-master}"
          # Read into an array so each filename is an independent argument and is never
          # re-split; a PR-controlled filename starting with '-' or containing spaces
          # must not be parsed as Prettier flags or split into multiple arguments.
          mapfile -t files < <(git diff --name-only --diff-filter=AM "origin/$base...HEAD")
          if [ "${#files[@]}" -eq 0 ]; then echo 'No changed files to check'; exit 0; fi
          # Prettier returns 0 when all files are formatted, non-zero otherwise.
          npx --no-install prettier --check "${files[@]}"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validate release configuration
        run: pnpm verify:release-config
      - name: Build unpacked Linux application
        run: node scripts/run-builder.mjs --linux --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_NO_ASAR: '1'
