          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px">
            <div><div style="font-size:10.5px;color:var(--ink-low)">写作辅助</div><div style="font-size:12px;color:var(--ink-hi);font-family:var(--font-mono)">${pr.model.writing}</div></div>
            <div><div style="font-size:10.5px;color:var(--ink-low)">对话</div><div style="font-size:12px;color:var(--ink-hi);font-family:var(--font-mono)">${pr.model.chat}</div></div>
            <div><div style="font-size:10.5px;color:var(--ink-low)">Embedding</div><div style="font-size:12px;color:var(--ink-hi);font-family:var(--font-mono)">${pr.model.embed}</div></div>
          </div>
          <div style="margin-top:10px;display:flex;gap:6px">
            <button class="btn sm">编辑…</button>
            <button class="btn sm ghosty">测试连接</button>
            <span style="margin-left:auto;font-size:11px;color:var(--green)">主进程持钥 · 前端无落盘</span>
          </div>
        </div>
        <button class="btn sm">${svg('i-plus')}新建 Profile</button>
        <div class="set-note">多 Profile 供应商配置，各 AI 功能可分别指定模型；API Key 由主进程管理（09 号票决策）。</div>
      `).join('');
    }
    else if(setTab==='stack'){
      body().innerHTML = stackInfoHTML();
    }
  };
  render();
  m.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',()=>{
    setTab = b.dataset.st; render();
  }));
  m.addEventListener('click', ev=>{ if(ev.target===m || ev.target.closest('[data-close]')) m.remove(); });
}

function showPermDiff(p){
  const m = document.createElement('div');
  m.className='scrim';
  m.innerHTML = `<div class="modal sm">
    <div class="modal-head">
      <h3>${svg('i-shield')}权限变更 · ${esc(p.name)}<div class="sub">${p.install?'安装前确认':'当前权限'}</div></h3>
      <button class="icon-btn" style="margin-left:auto" data-close>${svg('i-x')}</button>
    </div>
    <div class="modal-body">
      <div class="perm">
        <div class="perm-row ${p.install?'ask':''} ok">${svg('i-book')}<span>读取库文件 (vault:read)</span><span class="d">${p.install?'新增':'已授予'}</span></div>
        <div class="perm-row ${p.caps?.includes('net:fetch')?'ask':''} ${p.caps?.includes('net:fetch')?'':'ok'}">${svg('i-globe')}<span>网络请求 (net:fetch)</span><span class="d">${p.caps?.includes('net:fetch')?(p.install?'新增':'已授予'):'未请求'}</span></div>
        <div class="perm-row ${p.caps?.includes('fs:write')?'ask':''}">${svg('i-folder')}<span>写入磁盘 (fs:write)</span><span class="d">${p.caps?.includes('fs:write')?(p.install?'新增':'已授予'):'未请求'}</span></div>
        <div class="perm-row ${p.install?'ask':''}">${svg('i-plug')}<span>注册块类型 (block:register)</span><span class="d">${p.install?'新增':'已授予'}</span></div>
      </div>
      <div class="set-note">权限 = 安装 diff + 运行时首用确认 + 逐项 revoke（10 号票决策）。</div>
    </div>
    <div class="modal-foot">
      <button class="btn ghosty" data-close>${p.install?'取消':'关闭'}</button>
      <span style="flex:1"></span>
      ${p.install?'<button class="btn primary">确认安装</button>':'<button class="btn danger">撤销全部权限</button>'}
    </div>
  </div>`;
  $('#overlay-root').appendChild(m);
  m.addEventListener('click', ev=>{ if(ev.target===m || ev.target.closest('[data-close]')) m.remove(); });
}

function stackInfoHTML(){
  return `<div class="stack-pop" style="position:relative;min-width:100%;width:100%;backdrop-filter:none;background:transparent;border:none;box-shadow:none;padding:0">
    <div class="row"><span class="k">桌面壳</span><span class="v">Electron 30.x</span></div>
    <div class="row"><span class="k">前端</span><span class="v">React 18 + TypeScript · <em>TailwindCSS + shadcn/ui</em></span></div>
    <div class="row"><span class="k">编辑器内核</span><span class="v">TipTap 3 + @tiptap/markdown + UniqueID + DragHandle + Suggestion</span></div>
    <div class="row"><span class="k">存储方言</span><span class="v">MD + YAML frontmatter · Obsidian 公开方言（^id / callout / wikilink+别名）</span></div>
    <div class="row"><span class="k">索引</span><span class="v">SQLite 单库：FTS5 + Link Index + sqlite-vec</span></div>
    <div class="row"><span class="k">Git</span><span class="v">simple-git 调 <em>默认捆绑 dugite-native</em> · 系统凭证/SSH 集成 · 系统 Git 高级回退</span></div>
    <div class="trade">
      <b>取舍一句话：</b>同赛道先例最全、块编辑器生态最稳，代价是接受 Electron 的体积与内存底线（~187 MB 基准）。
      三案原型<strong>同绑默认栈</strong>，差异只在产品形态——B 案主张「知识网络优先」：图谱与回链是一等公民，编辑器为网络服务。
    </div>
  </div>`;
}

function showStackPopover(anchorEl){
  closeAllPopups();
  const m = document.createElement('div');
  m.className='anchored';
  m.innerHTML = stackInfoHTML();
  document.body.appendChild(m);
  const r = anchorEl.getBoundingClientRect();
  m.style.top = (r.top - 12 - m.offsetHeight) + 'px';
  m.style.left = Math.min(r.right - m.offsetWidth, window.innerWidth - m.offsetWidth - 14) + 'px';
  m._popup = true;
}

function showChangesPopover(anchorEl){
  closeAllPopups();
  const m = document.createElement('div');
  m.className='anchored';
  m.innerHTML = `<div style="font-size:11px;letter-spacing:1px;color:var(--ink-low);text-transform:uppercase;margin-bottom:6px">未提交变更 · ${CHANGES.length} 文件</div>
    <div style="display:flex;flex-direction:column;gap:2px">
      ${CHANGES.map(c=>`<div class="chg-item"><span class="st ${c.st==='M'?'m':c.st==='A'?'a':'u'}">${c.st}</span><span>${esc(c.file)}</span></div>`).join('')}
    </div>
    <div style="display:flex;gap:6px;margin-top:10px">
      <button class="btn sm primary" id="chg-commit2">${svg('i-commit')}提交…</button>
      <button class="btn sm" id="chg-diff2">查看 diff</button>
    </div>`;
  document.body.appendChild(m);
  const r = anchorEl.getBoundingClientRect();
  m.style.top = (r.top - 12 - m.offsetHeight) + 'px';
  m.style.left = Math.max(10, r.left) + 'px';
  m._popup = true;
  m.querySelector('#chg-diff2').addEventListener('click',()=>{ closeAllPopups(); openUncommittedDiff(); });
  m.querySelector('#chg-commit2').addEventListener('click',()=>{ closeAllPopups(); toast('已进入手动提交流（示意）'); });
}

function showPullPushPopover(anchorEl, kind){
  closeAllPopups();
  const m = document.createElement('div');
  m.className='anchored';
  m.style.width = '280px';
  m.innerHTML = kind==='pull'
    ? `<div style="font-size:13px;font-weight:600;margin-bottom:6px">拉取 origin/main</div>
       <div style="font-size:12px;color:var(--ink-low);margin-bottom:10px">检测到 <b style="color:var(--teal)">2</b> 个待拉取提交。已通过授权预检。</div>
       <div style="display:flex;gap:6px"><button class="btn primary" id="do-pull">确认拉取</button><button class="btn" id="no-pull">取消</button></div>`
    : `<div style="font-size:13px;font-weight:600;margin-bottom:6px">推送到 origin/main</div>
       <div style="font-size:12px;color:var(--ink-low);margin-bottom:10px">本地 <b style="color:var(--amber)">1</b> 个待推送提交。SSH agent 已授权。</div>
       <div style="display:flex;gap:6px"><button class="btn primary" id="do-push">确认推送</button><button class="btn" id="no-push">取消</button></div>`;
  document.body.appendChild(m);
  const r = anchorEl.getBoundingClientRect();
  m.style.top = (r.top - 12 - m.offsetHeight) + 'px';
  m.style.left = Math.max(10, r.left) + 'px';
  m._popup = true;
  const btn = kind==='pull' ? '#do-pull' : '#do-push';
  m.querySelector(btn).addEventListener('click',()=>{
    closeAllPopups();
    toast(kind==='pull' ? '已拉取 2 个提交 · 自动合并 (快进)' : '推送成功 · 1 commit → origin/main');
  });
  m.querySelector(kind==='pull' ? '#no-pull' : '#no-push').addEventListener('click', closeAllPopups);
}

function closeAllPopups(){
  $$('.anchored, .popmenu, #selbar, #linkpeek').forEach(el=>el.remove());
  // graph peek too
  $('#graph-peek-holder') && ($('#graph-peek-holder').innerHTML = '');
}
document.addEventListener('pointerdown', ev=>{
  if(!ev.target.closest('.anchored') && !ev.target.closest('.icon-btn') && !ev.target.closest('#selbar') && !ev.target.closest('[contenteditable]') && !ev.target.closest('.popmenu')){
    // close popups that are not triggered by this click
    $$('.anchored').forEach(el=>{ if(!el.contains(ev.target)) el.remove(); });
  }
});

// tweaks
let tweaksOpen = false;
$('#tweaks-fab').addEventListener('click', ()=>{
  tweaksOpen = !tweaksOpen;
  if(tweaksOpen){
    const t = document.createElement('div');
    t.id='tweaks';
    t.innerHTML = `<h5>Tweaks</h5>
      <div class="tw-row">紧凑模式 <div class="toggle ${document.body.classList.contains('compact')?'on':''}" data-tw="compact"><i></i></div></div>
      <div class="tw-row">图谱辉光 <div class="toggle on" data-tw="glow"><i></i></div></div>
      <div class="tw-row">界面动效 <div class="toggle on" data-tw="motion"><i></i></div></div>
      <div class="tw-row" style="padding-top:10px;border-top:1px dashed var(--line)">
        <span style="font-size:11px;color:var(--ink-low)">原型 B · 知识网络优先</span>
      </div>`;
    document.body.appendChild(t);
    t.querySelectorAll('[data-tw]').forEach(sw=>sw.addEventListener('click',()=>{
      sw.classList.toggle('on');
      const k = sw.dataset.tw;
      document.body.classList.toggle(k==='compact'?'compact':k==='glow'?'no-glow':'no-motion', !sw.classList.contains('on'));
      if(k==='glow' && G){ G.opts.glow = sw.classList.contains('on'); }
    }));
  } else {
    $('#tweaks')?.remove();
  }
});
// ============================================================
// INIT + KEYBOARD + TOPBAR ACTIONS
// ============================================================
function toggleDock(){
  state.dockCollapsed = !state.dockCollapsed;
  $('#dock').classList.toggle('collapsed', state.dockCollapsed);
  $('#btn-dock').classList.toggle('on', !state.dockCollapsed);
}

document.addEventListener('keydown', ev=>{
  // ⌘K palette
  if((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase()==='k'){
    ev.preventDefault();
    if(state.paletteOpen) closePalette(); else openPalette();
  }
  // ⌘\ toggle dock
  if((ev.metaKey || ev.ctrlKey) && ev.key==='\\'){
    ev.preventDefault();
    toggleDock();
  }
  // ⌘⇧F search
  if((ev.metaKey || ev.ctrlKey) && ev.shiftKey && ev.key.toLowerCase()==='f'){
    ev.preventDefault();
    state.sbSearchMode = true;
    renderSidebar();
  }
  // ⌘⇧G graph
  if((ev.metaKey || ev.ctrlKey) && ev.shiftKey && ev.key.toLowerCase()==='g'){
    ev.preventDefault();
    openGraphTab();
  }
  if(ev.key === 'Escape'){
    if(state.paletteOpen) closePalette();
    else {
      $$('.scrim').forEach(m => m.remove());
      closeAllPopups();
    }
  }
});

// titlebar buttons
$('#btn-palette').addEventListener('click', openPalette);
$('#btn-graph-tab').addEventListener('click', openGraphTab);
$('#btn-dock').addEventListener('click', toggleDock);
$('#btn-settings').addEventListener('click', openSettings);
$('#btn-stack').addEventListener('click', ev=>{
  ev.stopPropagation();
  if($$('.anchored').length) closeAllPopups();
  else showStackPopover($('#btn-stack'));
});
$('#btn-collapse-sb').addEventListener('click', ()=>{
  state.sidebarCollapsed = !state.sidebarCollapsed;
  $('#sidebar').classList.toggle('collapsed', state.sidebarCollapsed);
});
$('#btn-collapse-dock').addEventListener('click', toggleDock);

// sidebar tabs
$$('.sb-tabs button').forEach(b=>b.addEventListener('click',()=>{
  state.sbTab = b.dataset.sbtab;
  state.sbSearchMode = false;
  renderSidebar();
}));
$('#btn-search-full').addEventListener('click',()=>{
  state.sbSearchMode = true;
  state.searchQuery = '';
  renderSidebar();
});
$('#btn-skill-settings').addEventListener('click',()=>{ setTab='skills'; openSettings(); });

// status bar
$('#sb-branch').addEventListener('click', ev=>{
  ev.stopPropagation();
  toast('分支选择器（示意）· 当前 main');
});
$('#sb-changes').addEventListener('click', ev=>{
  ev.stopPropagation();
  showChangesPopover($('#sb-changes'));
});
$('#sb-pull').addEventListener('click', ev=>{
  ev.stopPropagation();
  showPullPushPopover($('#sb-pull'), 'pull');
});
$('#sb-push').addEventListener('click', ev=>{
  ev.stopPropagation();
  showPullPushPopover($('#sb-push'), 'push');
});

// dock send
$('#btn-ai-send').addEventListener('click', sendAiMessage);
$('#ai-input').addEventListener('keydown', ev=>{
  if(ev.key==='Enter' && !ev.shiftKey){ ev.preventDefault(); sendAiMessage(); }
});
$('#btn-ai-new').addEventListener('click', ()=>{
  state.aiMsgs = [];
  toast('新会话 · 保存后将成为 type: chat 页面');
  renderDock();
});

// ============================================================
// INIT RENDER
// ============================================================
renderTabs();
renderStage();
renderSidebar();
renderDock();

// first-time info toast
setTimeout(()=>{
  toast('提示：双击图谱节点打开页面 · 点击 [[ ]] 链接 · ⌘K 命令面板');
}, 500);
</script>
