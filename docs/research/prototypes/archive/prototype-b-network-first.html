<!DOCTYPE html>
<!-- ============================================================
  NexNote 整案原型 B · 知识网络优先 (network-first)
  PROTOTYPE — throwaway, for ticket 12 review only.
  绑定技术栈（08 号票默认栈，三案同绑）:
    Electron + React + TypeScript · TailwindCSS + shadcn/ui
    TipTap 3 (@tiptap/markdown / UniqueID / DragHandle / Suggestion)
    SQLite 单库 (FTS5 + Link Index + sqlite-vec)
    simple-git 调默认捆绑 Git (dugite-native) + 系统凭证集成
  取舍一句话: 同赛道先例最全、块编辑器生态最稳，代价是接受 Electron
  体积与内存底线；本案差异不在栈，而在产品形态——图谱与回链是
  一等公民，编辑器为知识网络服务。
  ============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexNote · 原型 B — 知识网络优先</title>
<style>
:root{
  /* ---- tokens · night atlas ---- */
  --bg0: oklch(0.148 0.017 262);
  --bg1: oklch(0.175 0.019 262);
  --bg2: oklch(0.205 0.021 262);
  --bg3: oklch(0.235 0.023 262);
  --line: oklch(0.30 0.022 262 / .55);
  --line-strong: oklch(0.36 0.024 262 / .8);
  --ink-hi: oklch(0.93 0.008 258);
  --ink-mid: oklch(0.73 0.013 258);
  --ink-low: oklch(0.52 0.016 258);
  --teal: oklch(0.80 0.115 192);          /* 双链 / 主 accent */
  --teal-dim: oklch(0.80 0.115 192 / .16);
  --amber: oklch(0.80 0.125 82);          /* 标签 / 手动提交 */
  --amber-dim: oklch(0.80 0.125 82 / .14);
  --violet: oklch(0.74 0.12 300);
  --green: oklch(0.76 0.12 150);
  --rose: oklch(0.72 0.15 18);
  --red-soft: oklch(0.70 0.15 25);
  --shadow-1: 0 1px 2px oklch(0.08 0.01 262 / .5);
  --shadow-2: 0 4px 14px oklch(0.06 0.012 262 / .55);
  --shadow-3: 0 12px 40px oklch(0.05 0.012 262 / .65);
  --r-lg: 12px; --r-md: 9px; --r-sm: 6px;
  --ease: cubic-bezier(.25,.7,.3,99);
  --t-fast: 130ms var(--ease);
  --t-med: 190ms var(--ease);
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  --font-serif: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, monospace;
  --density: 1;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-ui);
  background:var(--bg0);
  color:var(--ink-hi);
  font-size:13.5px;
  line-height:1.65;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-wrap:pretty;
}
::selection{background:oklch(0.80 0.115 192 / .28);}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
input,textarea{font:inherit; color:inherit; background:none; border:none; outline:none;}
svg.ic{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:oklch(0.32 0.02 262 / .6); border-radius:8px; border:2px solid transparent; background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:oklch(0.42 0.02 262 / .7); border:2px solid transparent; background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--teal); outline-offset:1px; border-radius:3px;}

/* ================= app shell ================= */
#app{
  height:100vh; display:grid;
  grid-template-rows:40px 1fr 26px;
  grid-template-columns:1fr;
}
#mainrow{display:flex; min-height:0;}

/* ================= title bar ================= */
#titlebar{
  display:flex; align-items:center; gap:8px;
  background:oklch(0.13 0.016 262);
  border-bottom:1px solid var(--line);
  padding:0 10px; user-select:none;
  -webkit-app-region:drag; position:relative; z-index:60;
}
#titlebar .no-drag{-webkit-app-region:no-drag;}
.win-dots{display:flex; gap:7px; margin-right:4px;}
.win-dots i{width:11px; height:11px; border-radius:50%; display:block;}
.win-dots i:nth-child(1){background:oklch(0.72 0.14 28);}
.win-dots i:nth-child(2){background:oklch(0.80 0.13 90);}
.win-dots i:nth-child(3){background:oklch(0.75 0.13 150);}
.app-brand{display:flex; align-items:baseline; gap:8px; margin-left:2px;}
.app-brand .logo{font-family:var(--font-serif); font-size:15px; letter-spacing:.4px; font-weight:600; color:var(--ink-hi);}
.app-brand .logo b{color:var(--teal); font-weight:600;}
.proto-badge{
  font-size:10.5px; color:var(--amber); background:var(--amber-dim);
  border:1px solid oklch(0.80 0.125 82 / .3); padding:1px 8px; border-radius:99px; letter-spacing:.5px;
}
#tabstrip{flex:1; display:flex; align-items:stretch; gap:2px; overflow-x:auto; scrollbar-width:none; margin:0 8px; min-width:0;}
#tabstrip::-webkit-scrollbar{display:none;}
.tab{
  display:flex; align-items:center; gap:7px; padding:0 10px 0 12px;
  border-radius:8px 8px 0 0; margin-top:7px; font-size:12.3px; color:var(--ink-low);
  cursor:pointer; white-space:nowrap; max-width:190px; position:relative; flex:none;
  transition:color var(--t-fast), background var(--t-fast);
}
.tab:hover{color:var(--ink-mid); background:oklch(0.2 0.02 262 / .5);}
.tab.active{color:var(--ink-hi); background:var(--bg1);}
.tab.active::after{content:""; position:absolute; inset:auto 8px -1px 8px; height:2px; background:var(--teal); border-radius:2px;}
.tab .ic{width:13px; height:13px; opacity:.8;}
.tab .x{opacity:0; border-radius:4px; width:16px; height:16px; display:grid; place-items:center; transition:opacity var(--t-fast), background var(--t-fast);}
.tab .x .ic{width:11px; height:11px;}
.tab:hover .x, .tab.active .x{opacity:.7;}
.tab .x:hover{background:var(--bg3); opacity:1;}
.tb-actions{display:flex; gap:2px;}
.icon-btn{
  width:28px; height:28px; border-radius:7px; display:grid; place-items:center;
  color:var(--ink-low); transition:all var(--t-fast);
}
.icon-btn:hover{color:var(--ink-hi); background:var(--bg2);}
.icon-btn.on{color:var(--teal);}
.icon-btn.on::before{content:""; position:absolute; width:28px; height:28px; border-radius:7px; background:var(--teal-dim); z-index:-1;}
#btn-stack{position:relative;}

/* ================= sidebar ================= */
#sidebar{
  width:232px; flex:none; background:var(--bg1);
  border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0;
  transition:width var(--t-med), opacity var(--t-med);
}
#sidebar.collapsed{width:0; opacity:0; overflow:hidden; border:none;}
.vault-head{padding:10px 12px 8px; border-bottom:1px solid var(--line);}
.vault-name{display:flex; align-items:center; gap:7px; font-weight:600; font-size:13px;}
.vault-name .ic{color:var(--teal);}
.vault-branch{margin-top:5px; display:flex; gap:5px; align-items:center; font-size:11px; color:var(--ink-low);}
.vault-branch .mono{color:var(--ink-mid);}
.sb-search{display:flex; gap:5px; padding:8px 10px;}
.sb-search button{
  flex:1; display:flex; align-items:center; gap:7px; padding:5px 9px; border-radius:7px;
  background:var(--bg2); border:1px solid var(--line); color:var(--ink-low); font-size:12px;
  transition:all var(--t-fast);
}
.sb-search button:hover{color:var(--ink-mid); border-color:var(--line-strong);}
.sb-search kbd, kbd.kb{
  font-family:var(--font-mono); font-size:10px; background:var(--bg3); border:1px solid var(--line-strong);
  border-radius:4px; padding:0 5px; color:var(--ink-mid); line-height:1.5; margin-left:auto;
}
.sb-tabs{display:flex; padding:0 10px; gap:2px; border-bottom:1px solid var(--line);}
.sb-tabs button{
  padding:6px 10px; font-size:12px; color:var(--ink-low); border-radius:7px 7px 0 0; position:relative;
  transition:color var(--t-fast);
}
.sb-tabs button:hover{color:var(--ink-mid);}
.sb-tabs button.on{color:var(--ink-hi);}
.sb-tabs button.on::after{content:""; position:absolute; left:8px; right:8px; bottom:-1px; height:2px; background:var(--teal); border-radius:2px;}
.sb-tabs button .n{font-size:10px; color:var(--teal); margin-left:3px;}
.sb-body{flex:1; overflow-y:auto; padding:6px 6px 16px; min-height:0;}
.sb-sec{font-size:10.5px; letter-spacing:1.2px; color:var(--ink-low); padding:12px 8px 4px; text-transform:uppercase;}

/* page tree */
.node-row{
  display:flex; align-items:center; gap:6px; padding:4px 8px; border-radius:6px;
  font-size:12.6px; color:var(--ink-mid); cursor:pointer; user-select:none;
  transition:background var(--t-fast), color var(--t-fast);
}
.node-row:hover{background:var(--bg2); color:var(--ink-hi);}
.node-row.on{background:var(--teal-dim); color:var(--teal);}
.node-row .ic{width:13px; height:13px; opacity:.75;}
.node-row .tw{width:14px; height:14px; display:grid; place-items:center; flex:none; border-radius:4px;}
.node-row .tw .ic{width:10px; height:10px; transition:transform var(--t-fast); opacity:.6;}
.node-row .tw.open .ic{transform:rotate(90deg);}
.node-row .cnt{margin-left:auto; font-size:10.5px; color:var(--ink-low); font-family:var(--font-mono);}
.node-kids{margin-left:13px; border-left:1px solid var(--line); padding-left:4px; display:none;}
.node-kids.open{display:block;}

/* backlinks panel */
.bl-item{
  padding:7px 9px; border-radius:8px; margin:3px 0; cursor:pointer;
  border:1px solid transparent; transition:all var(--t-fast);
}
.bl-item:hover{background:var(--bg2); border-color:var(--line);}
.bl-title{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-hi);}
.bl-title .ic{width:12px; height:12px; color:var(--teal);}
.bl-snip{
  font-size:11.6px; color:var(--ink-low); margin-top:3px; line-height:1.55;
  border-left:2px solid var(--line-strong); padding-left:8px;
}
.bl-snip .hl{color:var(--teal); background:var(--teal-dim); border-radius:3px; padding:0 2px;}
.bl-snip mark{background:var(--amber-dim); color:var(--amber); border-radius:3px; padding:0 2px;}
.bl-flag{font-size:9.5px; padding:1px 6px; border-radius:99px; background:var(--bg3); color:var(--ink-low); margin-left:auto; flex:none;}
.bl-flag.blk{color:var(--violet); background:oklch(0.74 0.12 300 / .14);}

/* tags panel */
.tag-row{
  display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px; cursor:pointer;
  color:var(--ink-mid); font-size:12.5px; transition:all var(--t-fast);
}
.tag-row:hover{background:var(--bg2);}
.tagchip{
  display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:1px 8px 1px 6px;
  border-radius:99px; background:var(--amber-dim); color:var(--amber); border:1px solid oklch(0.80 0.125 82 / .25);
}
.tagchip .ic{width:11px; height:11px;}
.tag-row .cnt{margin-left:auto; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-low);}
.sb-foot{border-top:1px solid var(--line); padding:6px 10px; display:flex; gap:4px; align-items:center; color:var(--ink-low); font-size:11px;}
.sb-foot button{display:flex; align-items:center; gap:6px; padding:3px 8px; border-radius:6px; color:var(--ink-low); transition:all var(--t-fast);}
.sb-foot button:hover{background:var(--bg2); color:var(--ink-hi);}
.sb-foot .plugin-dot{width:6px; height:6px; border-radius:50%; background:var(--green);}

/* ================= center stage ================= */
#stage{flex:1; min-width:0; display:flex; flex-direction:column; position:relative; background:var(--bg0);}

/* ---- page view ---- */
.pageview{flex:1; display:flex; min-height:0; overflow:hidden;}
.page-main{flex:1; min-width:0; overflow-y:auto; padding:0 0 90px; scroll-behavior:smooth;}
.page-inner{max-width:736px; margin:0 auto; padding:26px 48px 0;}
.crumb{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-low); margin-bottom:14px;}
.crumb a{color:var(--ink-low); text-decoration:none; cursor:pointer;}
.crumb a:hover{color:var(--teal);}
.crumb .ic{width:11px; height:11px;}
.page-head h1{
  font-family:var(--font-serif); font-weight:600; font-size:34px; line-height:1.25;
  letter-spacing:.2px; margin-bottom:10px; text-wrap:balance;
}
.degree-row{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.deg-chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:2.5px 10px;
  border-radius:99px; background:var(--bg2); border:1px solid var(--line); color:var(--ink-mid);
}
.deg-chip .ic{width:12px; height:12px;}
.deg-chip b{color:var(--ink-hi); font-family:var(--font-mono); font-weight:500;}
.deg-chip.linked{border-color:oklch(0.80 0.115 192/.35); color:var(--teal); background:var(--teal-dim);}
.deg-chip.back{border-color:oklch(0.74 0.12 300/.3); color:var(--violet); background:oklch(0.74 0.12 300/.12);}
.head-actions{display:flex; gap:4px; margin-left:auto;}

/* properties */
#props{
  border:1px solid var(--line); border-radius:var(--r-lg); background:var(--bg1);
  margin-bottom:26px; overflow:hidden;
}
.props-head{display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--bg2);}
.props-head .ttl{font-size:12px; color:var(--ink-mid); display:flex; align-items:center; gap:6px;}
.props-head .ttl .ic{width:13px; height:13px; color:var(--amber);}
.props-head .sp{flex:1;}
.seg{display:flex; background:var(--bg0); border:1px solid var(--line); border-radius:7px; padding:1.5px;}
.seg button{font-size:11px; padding:2px 10px; border-radius:5px; color:var(--ink-low); transition:all var(--t-fast);}
.seg button.on{background:var(--bg3); color:var(--ink-hi);}
.props-body{padding:10px 12px;}
.prop-row{display:grid; grid-template-columns:110px 1fr; gap:10px; padding:4.5px 0; font-size:12.5px; align-items:baseline;}
.prop-row + .prop-row{border-top:1px dashed var(--line);}
.prop-k{color:var(--ink-low); font-family:var(--font-mono); font-size:11.5px;}
.prop-v{color:var(--ink-hi); display:flex; gap:5px; flex-wrap:wrap; align-items:center;}
.prop-v .xchip{cursor:pointer; opacity:.55; display:inline-grid; place-items:center;}
.prop-v .xchip:hover{opacity:1; color:var(--rose);}
.prop-v .addtag{font-size:11px; color:var(--ink-low); border:1px dashed var(--line-strong); border-radius:99px; padding:1px 9px; cursor:pointer;}
.prop-v .addtag:hover{color:var(--teal); border-color:var(--teal);}
.yaml-src{
  font-family:var(--font-mono); font-size:11.8px; line-height:1.7; color:var(--ink-mid);
  white-space:pre; padding:4px 2px;
}
.yaml-src .yk{color:var(--violet);} .yaml-src .ys{color:var(--amber);} .yaml-src .yb{color:var(--teal);}

/* confidence module */
.conf-box{
  display:flex; gap:16px; align-items:center; padding:12px; border-radius:var(--r-md);
  background:linear-gradient(120deg, oklch(0.205 0.021 262), oklch(0.175 0.019 262));
  border:1px solid var(--line); margin-top:10px;
}
.conf-ring{position:relative; width:64px; height:64px; flex:none;}
.conf-ring svg{transform:rotate(-90deg);}
.conf-ring .val{
  position:absolute; inset:0; display:grid; place-items:center; font-family:var(--font-mono);
  font-size:17px; font-weight:600;
}
.conf-facts{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:5px 18px;}
.cf-row{font-size:11.5px;}
.cf-row .k{color:var(--ink-low); display:flex; justify-content:space-between;}
.cf-row .k b{color:var(--ink-hi); font-weight:500; font-family:var(--font-mono);}
.cf-bar{height:3px; border-radius:3px; background:var(--bg3); margin-top:3px; overflow:hidden;}
.cf-bar i{display:block; height:100%; border-radius:3px; background:linear-gradient(90deg, var(--teal), var(--amber));}
.conf-note{font-size:10.5px; color:var(--ink-low); margin-top:2px;}
.conf-note b{color:var(--teal); font-family:var(--font-mono); font-weight:500;}

/* ---- blocks / editor ---- */
.block{position:relative; padding:2px 44px 2px 6px; border-radius:6px; transition:background var(--t-fast);}
.block:hover, .block:focus-within{background:oklch(0.2 0.02 262 / .45);}
.block-handle{
  position:absolute; left:-24px; top:4px; width:20px; height:22px; display:grid; place-items:center;
  color:var(--ink-low); opacity:0; cursor:grab; border-radius:5px; transition:opacity var(--t-fast);
}
.block:hover > .block-handle{opacity:.85;}
.block-handle:hover{color:var(--ink-hi); background:var(--bg2);}
.block-handle .ic{width:12px; height:12px;}
.block-anchor{
  position:absolute; right:8px; top:5px; font-family:var(--font-mono); font-size:10px;
  color:var(--ink-low); opacity:0; cursor:pointer; padding:0 3px; border-radius:4px; transition:opacity var(--t-fast);
}
.block:hover > .block-anchor{opacity:.7;}
.block-anchor:hover{color:var(--teal); background:var(--bg2); opacity:1;}
.block[draggable=true]{opacity:.35;}
.block.drop-above::before, .block.drop-below::after{
  content:""; position:absolute; left:0; right:0; height:2px; background:var(--teal); border-radius:2px;
}
.block.drop-above::before{top:-3px;} .block.drop-below::after{bottom:-3px;}
.blk{outline:none; min-height:1em;}
.blk h2, .blk-h2{font-size:19px; font-weight:650; margin:18px 0 6px; line-height:1.4; color:var(--ink-hi);}
.blk h3, .blk-h3{font-size:15.5px; font-weight:650; margin:14px 0 4px; color:var(--ink-hi);}
.blk p{margin:5px 0; color:oklch(0.85 0.01 258);}
.blk ul{margin:5px 0; padding-left:22px;}
.blk li{margin:3px 0; color:oklch(0.85 0.01 258);}
.blk blockquote{border-left:3px solid var(--violet); padding:6px 14px; margin:8px 0; color:var(--ink-mid); background:oklch(0.74 0.12 300 / .06); border-radius:0 8px 8px 0;}
.blk code{font-family:var(--font-mono); font-size:.86em; background:var(--bg2); border:1px solid var(--line); padding:1px 5px; border-radius:5px; color:oklch(0.85 0.03 200);}
.codeblock{
  font-family:var(--font-mono); font-size:12px; line-height:1.7; background:oklch(0.125 0.015 262);
  border:1px solid var(--line); border-radius:var(--r-md); padding:12px 14px; margin:8px 0;
  overflow-x:auto; position:relative; color:oklch(0.8 0.012 258); white-space:pre;
}
.codeblock .lang{
  position:absolute; top:6px; right:10px; font-size:9.5px; letter-spacing:1px; color:var(--ink-low);
  text-transform:uppercase; font-family:var(--font-mono);
}
.callout{
  display:flex; gap:10px; padding:10px 14px; margin:8px 0; border-radius:var(--r-md);
  background:var(--teal-dim); border:1px solid oklch(0.80 0.115 192 / .25);
}
.callout.violet{background:oklch(0.74 0.12 300/.09); border-color:oklch(0.74 0.12 300/.28);}
.callout .ic{width:15px; height:15px; margin-top:3px; color:var(--teal);}
.callout.violet .ic{color:var(--violet);}
.callout .co-title{font-size:11.5px; font-weight:650; letter-spacing:.5px; color:var(--teal); margin-bottom:2px;}
.callout.violet .co-title{color:var(--violet);}
.callout .co-body{font-size:12.8px; color:oklch(0.85 0.01 258);}

/* wikilinks & inline tags */
a.wl{
  color:var(--teal); text-decoration:none; border-bottom:1px dotted oklch(0.80 0.115 192/.55);
  cursor:pointer; padding:0 1px; transition:background var(--t-fast); border-radius:3px;
}
a.wl:hover{background:var(--teal-dim); border-bottom-style:solid;}
a.wl.ghost{
  color:var(--amber); border-bottom:1px dashed oklch(0.80 0.125 82/.6);
}
a.wl.ghost:hover{background:var(--amber-dim);}
a.wl.blockref{border-bottom:1px dashed oklch(0.74 0.12 300/.6); color:var(--violet);}
.tag-inline{
  font-size:.88em; color:var(--amber); background:var(--amber-dim); border-radius:99px; padding:0 7px;
  cursor:pointer; border:1px solid transparent;
}
.tag-inline:hover{border-color:oklch(0.80 0.125 82/.35);}
sup.blk-id{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-low); margin-left:4px;}

/* AI insert hint */
.ai-inserted{outline:1px dashed oklch(0.80 0.115 192/.4); outline-offset:3px; border-radius:6px; animation:fadeIn var(--t-med);}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}

/* ---- right rail (local graph) ---- */
#rail{

  width:15px; height:15px; border-radius:4.5px; border:1.5px solid var(--line-strong); flex:none;
  display:grid; place-items:center; transition:all var(--t-fast);
}
.pick-item.on .cbx{background:var(--teal); border-color:var(--teal);}
.pick-item.on .cbx::after{content:""; width:4px; height:7px; border:solid oklch(0.16 0.02 250); border-width:0 1.5px 1.5px 0; transform:rotate(45deg) translateY(-1px);}
.pick-item .t{font-size:12.8px; color:var(--ink-hi);}
.pick-item .m{font-size:10.5px; color:var(--ink-low); margin-left:auto; display:flex; gap:8px; align-items:center; flex:none;}
.pick-item .m .mono{font-family:var(--font-mono);}

/* command palette */
#palette-scrim{align-items:start; padding-top:14vh;}
.palette{
  width:min(600px, 92vw); background:oklch(0.175 0.019 262/.97); backdrop-filter:blur(16px);
  border:1px solid var(--line-strong); border-radius:14px; box-shadow:var(--shadow-3); overflow:hidden;
  animation:pop var(--t-med) var(--ease); display:flex; flex-direction:column; max-height:62vh;
}
.pal-input{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line);}
.pal-input .ic{width:16px; height:16px; color:var(--ink-low);}
.pal-input input{flex:1; font-size:15px; color:var(--ink-hi);}
.pal-input input::placeholder{color:var(--ink-low);}
.pal-list{overflow-y:auto; padding:7px;}
.pal-group{font-size:10px; letter-spacing:1.2px; color:var(--ink-low); padding:9px 11px 4px; text-transform:uppercase;}
.pal-item{
  display:flex; align-items:center; gap:10px; padding:8px 11px; border-radius:9px; cursor:pointer; font-size:13px;
  color:var(--ink-mid); transition:background var(--t-fast);
}
.pal-item.sel, .pal-item:hover{background:var(--teal-dim); color:var(--ink-hi);}
.pal-item .ic{width:14px; height:14px; opacity:.75;}
.pal-item .k{margin-left:auto; font-size:10.5px; color:var(--ink-low); font-family:var(--font-mono);}

/* settings */
.set-tabs{display:flex; gap:2px; padding:10px 16px 0; border-bottom:1px solid var(--line);}
.set-tabs button{
  padding:7px 13px; font-size:12.3px; color:var(--ink-low); border-radius:8px 8px 0 0; position:relative;
}
.set-tabs button.on{color:var(--ink-hi);}
.set-tabs button.on::after{content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:2px; background:var(--teal);}
.set-row{
  display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px dashed var(--line);
}
.set-row .ic.grip{width:12px; height:12px; color:var(--ink-low); cursor:grab; opacity:.5;}
.set-row .nm{font-size:13px; color:var(--ink-hi);}
.set-row .ds{font-size:11px; color:var(--ink-low); margin-top:1px;}
.set-row .nm .builtin{font-size:9.5px; color:var(--teal); background:var(--teal-dim); padding:1px 6px; border-radius:99px; margin-left:6px; letter-spacing:.5px;}
.toggle{
  width:34px; height:19px; border-radius:99px; background:var(--bg3); border:1px solid var(--line-strong);
  position:relative; cursor:pointer; transition:all var(--t-fast); flex:none;
}
.toggle i{
  position:absolute; top:2px; left:2.5px; width:13px; height:13px; border-radius:50%; background:var(--ink-low);
  transition:all var(--t-fast);
}
.toggle.on{background:var(--teal); border-color:var(--teal);}
.toggle.on i{left:16.5px; background:oklch(0.16 0.02 250);}
.gear-btn{margin-left:auto; flex:none;}
.set-note{font-size:11px; color:var(--ink-low); line-height:1.7; padding:10px 4px 0;}

/* permission diff modal */
.perm{display:flex; flex-direction:column; gap:6px;}
.perm-row{
  display:flex; align-items:center; gap:9px; padding:8px 11px; border-radius:9px; background:var(--bg0);
  border:1px solid var(--line); font-size:12.3px;
}
.perm-row .ic{width:14px; height:14px; flex:none;}
.perm-row.ask{border-color:oklch(0.8 0.125 82/.4);}
.perm-row.ask .ic{color:var(--amber);}
.perm-row.ok .ic{color:var(--green);}
.perm-row .d{color:var(--ink-low); font-size:10.5px; margin-left:auto;}
.perm-row .mono{font-family:var(--font-mono); font-size:10.5px; color:var(--teal);}

/* selection toolbar */
#selbar{
  position:absolute; z-index:120; display:flex; gap:2px; padding:4px; border-radius:11px;
  background:oklch(0.19 0.02 262/.92); backdrop-filter:blur(14px); border:1px solid var(--line-strong);
  box-shadow:var(--shadow-2); animation:pop 110ms var(--ease);
}
#selbar button{
  font-size:11.5px; padding:3.5px 9px; border-radius:7px; color:var(--ink-mid); display:inline-flex; gap:4px; align-items:center;
  transition:all var(--t-fast); white-space:nowrap;
}
#selbar button:hover{background:var(--bg3); color:var(--ink-hi);}
#selbar button .ic{width:11px; height:11px; color:var(--teal);}
#selbar .sep{width:1px; background:var(--line-strong); margin:3px 2px;}

/* slash menu / wikilink popup */
.popmenu{
  position:absolute; z-index:130; min-width:230px; max-width:290px; background:oklch(0.185 0.02 262/.96);
  backdrop-filter:blur(12px); border:1px solid var(--line-strong); border-radius:11px; box-shadow:var(--shadow-2);
  padding:5px; animation:pop 110ms var(--ease); max-height:280px; overflow-y:auto;
}
.popmenu .grp{font-size:9.5px; letter-spacing:1.2px; color:var(--ink-low); padding:7px 9px 3px; text-transform:uppercase;}
.pm-item{
  display:flex; align-items:center; gap:9px; padding:6px 9px; border-radius:8px; cursor:pointer; font-size:12.6px;
  color:var(--ink-mid); transition:background var(--t-fast);
}
.pm-item:hover, .pm-item.sel{background:var(--teal-dim); color:var(--ink-hi);}
.pm-item .ic{width:14px; height:14px; opacity:.8;}
.pm-item .ic.ai{color:var(--teal);}
.pm-item .ds{font-size:10px; color:var(--ink-low); margin-left:auto; flex:none;}
.pm-item.ghost .ic{color:var(--amber);}

/* link preview card */
#linkpeek{
  position:absolute; z-index:140; width:264px; background:oklch(0.17 0.019 262/.95); backdrop-filter:blur(12px);
  border:1px solid var(--line-strong); border-radius:var(--r-lg); box-shadow:var(--shadow-3); padding:12px 14px;
  animation:pop var(--t-fast) var(--ease);
}
#linkpeek .ghost-flag{font-size:10px; color:var(--amber); display:flex; gap:5px; align-items:center; margin-bottom:4px;}

/* toast */
#toasts{position:fixed; bottom:40px; left:50%; transform:translateX(-50%); z-index:400; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;}
.toast{
  display:flex; align-items:center; gap:8px; font-size:12.3px; padding:8px 16px; border-radius:10px;
  background:oklch(0.2 0.02 262/.95); backdrop-filter:blur(10px); border:1px solid var(--line-strong);
  box-shadow:var(--shadow-2); animation:toastIn var(--t-med) var(--ease); color:var(--ink-hi);
}
.toast .ic{width:13px; height:13px; color:var(--teal);}
.toast.warn .ic{color:var(--amber);}
.toast.err .ic{color:var(--red-soft);}
@keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
.toast.out{animation:toastOut var(--t-med) var(--ease) forwards;}
@keyframes toastOut{to{opacity:0; transform:translateY(8px);}}

/* popover (generic anchored) */
.anchored{
  position:fixed; z-index:300; background:oklch(0.185 0.02 262/.97); backdrop-filter:blur(14px);
  border:1px solid var(--line-strong); border-radius:12px; box-shadow:var(--shadow-3); padding:11px;
  animation:pop var(--t-fast) var(--ease); min-width:230px; max-width:340px;
}

/* changes popover */
.chg-item{display:flex; align-items:center; gap:8px; padding:6px 9px; border-radius:8px; font-size:12.3px; color:var(--ink-mid); cursor:pointer;}
.chg-item:hover{background:var(--bg2); color:var(--ink-hi);}
.chg-item .st{font-family:var(--font-mono); font-size:10px; width:12px; text-align:center; flex:none;}
.chg-item .st.m{color:var(--amber);} .chg-item .st.a{color:var(--green);} .chg-item .st.u{color:var(--teal);}

/* stack popover */
.stack-pop{width:330px;}
.stack-pop .row{display:flex; gap:9px; padding:6px 0; font-size:11.8px; align-items:baseline;}
.stack-pop .k{width:70px; flex:none; color:var(--ink-low); font-size:10.5px; letter-spacing:.5px;}
.stack-pop .v{color:var(--ink-hi); font-family:var(--font-mono); font-size:11px; line-height:1.6;}
.stack-pop .v em{color:var(--teal); font-style:normal;}
.stack-pop .trade{
  margin-top:8px; padding-top:9px; border-top:1px dashed var(--line); font-size:11.3px; color:var(--ink-mid); line-height:1.7;
}
.stack-pop .trade b{color:var(--amber); font-weight:600;}

/* tweaks */
#tweaks-fab{
  position:fixed; right:12px; bottom:34px; z-index:150; width:26px; height:26px; border-radius:9px;
  background:oklch(0.22 0.02 262/.8); border:1px solid var(--line-strong); display:grid; place-items:center;
  color:var(--ink-low); transition:all var(--t-fast); opacity:.55;
}
#tweaks-fab:hover{opacity:1; color:var(--ink-hi); background:var(--bg3);}
#tweaks-fab .ic{width:13px; height:13px;}
#tweaks{
  position:fixed; right:12px; bottom:66px; z-index:150; width:212px; border-radius:13px;
  background:oklch(0.19 0.02 262/.97); backdrop-filter:blur(14px); border:1px solid var(--line-strong);
  box-shadow:var(--shadow-3); padding:12px 13px; animation:pop var(--t-fast) var(--ease);
}
#tweaks h5{font-size:11px; letter-spacing:1.2px; color:var(--ink-mid); text-transform:uppercase; margin-bottom:9px; display:flex;}
#tweaks .tw-row{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:12px; color:var(--ink-mid);}
#tweaks .tw-row .toggle{margin-left:auto;}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}
body.compact{--density:.88;}
body.compact .blk p{margin:3px 0;} 
body.compact .page-inner{padding-top:16px;}
body.no-glow .graph-legend .glow-note{display:none;}
body.no-motion .dock-empty .orb{animation:none;}
</style>

const $ = sel => document.querySelector(sel);
const $$ = sel => [...document.querySelectorAll(sel)];
const svg = id => `<svg class="ic"><use href="#${id}"/></svg>`;
const esc = s => (s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pageById = id => PAGES.find(p => p.id === id) || GHOSTS.find(g => g.id === id);
function pageLinks(pid){
  // returns array of {targetId, ghost}
  const p = pageById(pid);
  if(!p || !p.blocks) return [];
  const out = [];
  const walk = (t) => {
    if(!t) return;
    const re = /\[\[([^\]|#]+)(#[^\]|]+)?(\|[^\]]+)?\]\]/g;
    let m; while(m = re.exec(t)){
      const name = m[1].trim();
      const target = PAGES.find(p => p.title===name || (p.aliases||[]).includes(name))
                  || GHOSTS.find(g => g.title === name);
      if(target) out.push({targetId: target.id, ghost: !!target.firstSeen});
    }
  };
  for(const b of p.blocks){
    if(b.text) walk(b.text);
    if(b.items) b.items.forEach(walk);
    if(b.head) walk(b.head);
  }
  return out;
}
function pageBacklinks(pid){
  const out = [];
  for(const p of PAGES){
    const links = pageLinks(p.id);
    for(const l of links){
      if(l.targetId === pid){
        // find snippet block
        let snippet = '';
        let blkType = null;
        for(const b of p.blocks){
          const text = b.text || b.head || (b.items && b.items.join(' '));
          if(text && text.includes('[[')){
            // check if this block links to pid
            const re = /\[\[([^\]|#]+)/g;
            let m, found=false;
            while(m = re.exec(text)){
              const nm = m[1].trim();
              const t = PAGES.find(pp => pp.title===nm || (pp.aliases||[]).includes(nm));
              if(t && t.id===pid){ found=true; break; }
            }
            if(found){
              snippet = (b.text || b.head || b.items?.[0] || '').replace(/\[\[[^\]]+\]\]/g, '<span class="hl">$&</span>');
              blkType = b.type;
              break;
            }
          }
        }
        out.push({fromId: p.id, fromTitle: p.title, snippet, blkType});
        break;
      }
    }
  }
  return out;
}
function degreeOf(pid){
  let out = 0;
  for(const e of EDGES) if(e.includes(pid)) out++;
  return out;
}
function neighborsOf(pid, hops=1){
  const set = new Set([pid]);
  let frontier = new Set([pid]);
  for(let i=0;i<hops;i++){
    const next = new Set();
    for(const n of frontier){
      for(const e of EDGES){
        if(e[0]===n) next.add(e[1]);
        if(e[1]===n) next.add(e[0]);
      }
    }
    for(const n of next) set.add(n);
    frontier = next;
  }
  return set;
}
function renderInline(text){
  let t = esc(text);
  // wikilinks: [[name#^id|alias]]
  t = t.replace(/\[\[([^\]|#]+)(#[^\]|]+)?(\|[^\]]+)?\]\]/g, (m, name, hash, alias) => {
    const display = alias ? alias.slice(1) : name;
    const target = PAGES.find(p => p.title===name.trim() || (p.aliases||[]).includes(name.trim()));
    const ghost = GHOSTS.find(g => g.title === name.trim());
    const id = target ? target.id : ghost ? ghost.id : name;
    const cls = ghost ? 'wl ghost' : (hash && hash.startsWith('#^')) ? 'wl blockref' : 'wl';
    return `<a class="${cls}" data-target="${esc(id)}" title="${esc(name)}${hash?esc(hash):''}">${esc(display)}</a>`;
  });
  t = t.replace(/#([\u4e00-\u9fa5\w\-]+)/g, '<span class="tag-inline">#$1</span>');
  t = t.replace(/\^([a-z0-9]{4,6})/g, '<sup class="blk-id">^$1</sup>');
  return t;
}

}

// GRAPH ENGINE (canvas force-directed, reusable)

class Graph {
  constructor(canvas, opts={}){
    this.cv = canvas;
    this.cx = canvas.getContext('2d');
    this.opts = Object.assign({radiusBase:6, glow:true, mini:false, onOpen:null, onPeek:null, onHover:null}, opts);
    this.nodes = []; this.edges = [];
    this.drag = null; this.hover = null; this.peek = null;
    this.running = true;
    this._raf = null;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) this.opts.glow = false;
  }
  setData(nodeIds, edges){
    const W = this.cv.clientWidth || 300, H = this.cv.clientHeight || 200;
    const R = Math.min(W,H) * 0.34;
    this.nodes = nodeIds.map((id,i) => {
      const a = (i / nodeIds.length) * Math.PI * 2;
      return {
        id,
        x: W/2 + Math.cos(a)*R*(0.5+Math.random()*0.5),
        y: H/2 + Math.sin(a)*R*(0.5+Math.random()*0.5),
        vx:0, vy:0,
        r: this.opts.radiusBase + degreeOf(id)*1.1,
      };
    });
    this.edges = edges
      .filter(e => nodeIds.includes(e[0]) && nodeIds.includes(e[1]))
      .map(e => ({a:this.nodes.find(n=>n.id===e[0]), b:this.nodes.find(n=>n.id===e[1])}));
    this.resize();
    this.start();
  }
  resize(){
    const dpr = window.devicePixelRatio || 1;
    const W = this.cv.clientWidth, H = this.cv.clientHeight;
    if(!W || !H) return;
    this.cv.width = W * dpr; this.cv.height = H * dpr;
    this.cx.setTransform(dpr,0,0,dpr,0,0);
    this.W = W; this.H = H;
  }
  nodeAt(x,y){
    for(const n of this.nodes){
      const dx = x-n.x, dy = y-n.y;
      if(dx*dx+dy*dy < (n.r+5)*(n.r+5)) return n;
    }
    return null;
  }
  start(){
    if(this._raf) cancelAnimationFrame(this._raf);
    const step = () => {
      this.physics();
      this.draw();
      this._raf = requestAnimationFrame(step);
    };
    step();
  }
  physics(){
    const N = this.nodes;
    // repulsion
    for(let i=0;i<N.length;i++) for(let j=i+1;j<N.length;j++){
      const a=N[i], b=N[j];
      let dx=a.x-b.x, dy=a.y-b.y;
      let d2 = dx*dx+dy*dy || 1;
      const d = Math.sqrt(d2);
      const f = 1400/d2;
      dx/=d; dy/=d;
      a.vx += dx*f; a.vy += dy*f;
      b.vx -= dx*f; b.vy -= dy*f;
    }
    // springs
    for(const e of this.edges){
      const dx = e.b.x-e.a.x, dy = e.b.y-e.a.y;
      const d = Math.sqrt(dx*dx+dy*dy) || 1;
      const f = (d - 78) * 0.012;
      e.a.vx += dx/d*f; e.a.vy += dy/d*f;
      e.b.vx -= dx/d*f; e.b.vy -= dy/d*f;
    }
    // centering
    for(const n of N){
      n.vx += (this.W/2 - n.x) * 0.0025;
      n.vy += (this.H/2 - n.y) * 0.003;
      n.vx *= 0.86; n.vy *= 0.86;
      n.x += n.vx; n.y += n.vy;
    }
  }
  tagColor(id){
    const p = pageById(id);
    if(!p || !p.tags) return 'oklch(0.6 0.02 260)';
    const t = TAGS.find(t => t.id === p.tags[0]);
    return t ? t.color : 'oklch(0.6 0.02 260)';
  }
  draw(){
    const cx = this.cx;
    if(!this.W) return;
    cx.clearRect(0,0,this.W,this.H);
    const focus = this.hover || this.drag || null;
    const linked = focus ? new Set() : null;
    if(focus){
      linked.add(focus.id);
      for(const e of this.edges){
        if(e.a===focus) linked.add(e.b.id);
        if(e.b===focus) linked.add(e.a.id);
      }
    }
    // edges
    for(const e of this.edges){
      const hot = focus && (e.a===focus || e.b===focus);
      const dim = focus && !hot;
      cx.beginPath();
      cx.moveTo(e.a.x, e.a.y);
      cx.lineTo(e.b.x, e.b.y);
      cx.strokeStyle = hot
        ? 'oklch(0.80 0.115 192 / .9)'
        : dim ? 'oklch(0.4 0.02 260 / .12)'
        : 'oklch(0.55 0.06 210 / .35)';
      cx.lineWidth = hot ? 1.6 : 1;
      if(hot && this.opts.glow){ cx.shadowColor = 'oklch(0.8 0.115 192 / .8)'; cx.shadowBlur = 7; }
      cx.stroke();
      cx.shadowBlur = 0;
    }
    // nodes
    for(const n of this.nodes){
      const isFocus = focus === n;
      const dim = focus && !linked.has(n.id);
      const col = this.tagColor(n.id);
      cx.beginPath();
      cx.arc(n.x, n.y, n.r, 0, Math.PI*2);
      cx.fillStyle = dim ? 'oklch(0.35 0.015 260 / .35)' : col;
      cx.globalAlpha = dim ? .4 : 1;
      if((isFocus || (!focus && this.opts.glow)) && !dim){
        cx.shadowColor = col;
        cx.shadowBlur = isFocus ? 16 : 8;
      }
      cx.fill();
      cx.shadowBlur = 0;
      // focus pulse ring
      if(isFocus){
        cx.beginPath();
        cx.arc(n.x, n.y, n.r+4.5, 0, Math.PI*2);
        cx.strokeStyle = col;
        cx.lineWidth = 1.2;
        cx.stroke();
      }
      cx.globalAlpha = 1;
      // labels
      if(!this.opts.mini || isFocus || (!focus && this.nodes.length<=8) || linked.has(n.id)){
        const p = pageById(n.id);
        cx.font = `${this.opts.mini?9.5:11}px ${getComputedStyle(document.body).getPropertyValue('--font-ui')}`;
        cx.textAlign = 'center';
        cx.fillStyle = dim ? 'oklch(0.5 0.02 260 / .4)' : isFocus ? 'oklch(0.95 0.01 258)' : 'oklch(0.72 0.012 258 / .92)';
        const label = p ? p.title : n.id;
        cx.fillText(label, n.x, n.y + n.r + 13);
      }
    }
  }
  attach(){
    const cv = this.cv;
    cv.addEventListener('pointermove', ev => {
      const r = cv.getBoundingClientRect();
      const x = ev.clientX - r.left, y = ev.clientY - r.top;
      if(this.drag){
        this.drag.x = x; this.drag.y = y; this.drag.vx=0; this.drag.vy=0;
        cv.style.cursor = 'grabbing';
        return;
      }
      const n = this.nodeAt(x,y);
      this.hover = n;
      cv.style.cursor = n ? 'pointer' : 'grab';
      this.opts.onHover && this.opts.onHover(n, x, y);
    });
    cv.addEventListener('pointerdown', ev => {
      const r = cv.getBoundingClientRect();
      const n = this.nodeAt(ev.clientX-r.left, ev.clientY-r.top);
      if(n){ this.drag = n; cv.setPointerCapture(ev.pointerId); }
    });
    cv.addEventListener('pointerup', ev => {
      const r = cv.getBoundingClientRect();
      const n = this.nodeAt(ev.clientX-r.left, ev.clientY-r.top);
      if(this.drag && n === this.drag){
        this.opts.onPeek && this.opts.onPeek(n, ev.clientX - r.left, ev.clientY - r.top);
      }
      this.drag = null;
      cv.style.cursor = n ? 'pointer' : 'grab';
    });
    cv.addEventListener('dblclick', ev => {
      const r = cv.getBoundingClientRect();
      const n = this.nodeAt(ev.clientX-r.left, ev.clientY-r.top);
      if(n) this.opts.onOpen && this.opts.onOpen(n.id);
    });
    cv.addEventListener('pointerleave', () => {
      this.hover = null;
      this.opts.onHover && this.opts.onHover(null);
    });
    const ro = new ResizeObserver(()=>{ this.resize(); });
    ro.observe(cv);
  }
}

// TABS
// ============================================================
function renderTabs(){
  const strip = $('#tabstrip');
  strip.innerHTML = '';
  for(const t of state.tabs){
    const el = document.createElement('div');
    const title = t.kind==='page' ? (pageById(t.pageId)?.title || t.title) : t.title;
    const icon = t.kind==='page' ? (pageById(t.pageId)?.firstSeen ? 'i-file' : 'i-file') : t.icon;
    el.className = 'tab' + (t.id===state.activeTab?' active':'');
    el.innerHTML = svg(icon) + `<span>${esc(title)}</span><span class="x" data-close="${t.id}">${svg('i-x')}</span>`;
    el.addEventListener('click', ev => {
      if(ev.target.closest('[data-close]')){
        closeTab(t.id);
      } else {
        state.activeTab = t.id;
        if(t.kind==='page') state.activePageId = t.pageId;
        renderTabs(); renderStage(); renderSidebar();
      }
    });
    strip.appendChild(el);
  }
}
function openPageTab(pageId){
  let t = state.tabs.find(t => t.kind==='page' && t.pageId===pageId);
  if(!t){
    t = {id:'t_'+pageId, kind:'page', pageId};
    state.tabs.push(t);
  }
  state.activeTab = t.id;
  state.activePageId = pageId;
  renderTabs(); renderStage(); renderSidebar();
}
function openGraphTab(){
  let t = state.tabs.find(t => t.kind==='graph');
  if(!t){
    t = {id:'t_graph', kind:'graph', title:'知识图谱', icon:'i-graph'};
    state.tabs.push(t);
  }
  state.activeTab = t.id;
  renderTabs(); renderStage();
}
function closeTab(id){
  const idx = state.tabs.findIndex(t => t.id===id);
  if(idx<0) return;
  state.tabs.splice(idx,1);
  if(state.activeTab===id){
    const next = state.tabs[Math.min(idx, state.tabs.length-1)];
    state.activeTab = next ? next.id : null;
    if(next && next.kind==='page') state.activePageId = next.pageId;
  }
  if(!state.tabs.length){ openGraphTab(); return; }
  renderTabs(); renderStage(); renderSidebar();
}

let G = null;  // global graph instance

function renderStage(){
  const stage = $('#stage');
  const tab = state.tabs.find(t => t.id === state.activeTab);
  closeAllPopups();
  if(!tab){ stage.innerHTML=''; return; }
  if(tab.kind==='graph') renderGraphView(stage);
  else renderPageView(stage, tab.pageId);
}

function renderGraphView(stage){
  const visibleIds = PAGES.filter(p => !state.tagFilter.size || p.tags.some(t=>state.tagFilter.has(t))).map(p=>p.id);
  stage.innerHTML = `
  <div class="graphview">

    <div class="graph-hud">
      <div class="graph-title">

        <p><b>${PAGES.length}</b> 页面 · <b>${EDGES.length}</b> 连接 · 全局视图 · 拖拽节点 / 双击打开页面</p>
      </div>
      <div class="graph-ctl">
        <div class="filter-bar">
          ${TAGS.filter(t=>PAGES.some(p=>p.tags.includes(t.id))).map(t=>`
            <button class="fchip ${state.tagFilter.has(t.id)?'on':''}" data-tagf="${t.id}"><i style="background:${t.color}"></i>${t.id}</button>
          `).join('')}

        </div>
        <div class="graph-legend">
          <span><i style="background:var(--ink-mid)"></i>节点大小 = 连接度</span>
          <span class="sep"></span>
          <span><i style="background:var(--teal)"></i>悬停高亮邻边</span>
          <span class="sep"></span>
          <span class="conf-no">置信度不映射图谱颜色（产品决策）</span>
        </div>
      </div>
    </div>
  </div>`;
  const wrap = $('#graph-wrap');
  const holder = $('#graph-peek-holder');
  $$('#graph-wrap [data-tagf]').forEach(b => b.addEventListener('click', ()=>{
    const t = b.dataset.tagf;
    if(state.tagFilter.has(t)) state.tagFilter.delete(t); else state.tagFilter.add(t);
    renderGraphView(stage);
  }));
  $('#graph-clear-f').addEventListener('click', ()=>{ state.tagFilter.clear(); renderGraphView(stage); });

  requestAnimationFrame(()=>{
    G = new Graph($('#graph-cv'), {
      radiusBase: 7,
      onOpen(id){ openPageTab(id); },
      onPeek(n, x, y){
        showNodePeek(n, x, y, holder, wrap);
      },
      onHover(n){
        if(!n){ /* keep peek if hovering it */ }
      }
    });
    G.setData(PAGES.map(p=>p.id), EDGES);
    G.attach();
  });
}

function showNodePeek(n, x, y, holder, wrap){
  holder.innerHTML='';
  const p = pageById(n.id);
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const el = document.createElement('div');
  el.className = 'peek';
  const isGhost = p && p.firstSeen;
  const deg = degreeOf(n.id);
  const bl = p && !isGhost ? pageBacklinks(n.id).length : 0;
  const snippet = p && !isGhost && p.blocks ? (p.blocks.find(b=>b.type==='p')?.text || p.blocks[0]?.text || '') : (isGhost ? '此页面尚未创建。点击创建并开始撰写。' : '');
  el.innerHTML = `
    <h3>${esc(p?p.title:n.id)}</h3>
    <div class="meta">
      ${isGhost ? '<span class="tagchip">未创建</span>' : `<span class="tagchip" style="background:var(--bg3);color:var(--ink-low);border-color:var(--line)">${esc(p.folder)}/</span>`}
      ${(p&&p.tags?p.tags:[]).map(t=>{const tc=TAGS.find(x=>x.id===t);return `<span class="tagchip"><i style="display:none"></i>#${esc(t)}</span>`}).join('')}
    </div>
    <div class="snip">${renderInline(snippet)}</div>
    <div class="deg"><span>双链 <b>${deg}</b></span><span>回链 <b class="v">${bl}</b></span>${!isGhost?`<span>置信度 <b style="color:var(--amber)">${p.conf}</b></span>`:''}</div>
    <div class="btns">
      <button class="btn primary sm" data-open="${n.id}">${svg('i-file')}打开页面</button>
      ${isGhost?`<button class="btn sm" data-create="${n.id}">${svg('i-plus')}创建页面</button>`:''}
    </div>`;
  el.querySelector('[data-open]')?.addEventListener('click', ()=>openPageTab(n.id));
  el.querySelector('[data-create]')?.addEventListener('click', ()=>{
    createGhostPage(n.id);
    holder.innerHTML='';
  });
  holder.appendChild(el);
  const r = el.getBoundingClientRect();
  let px = Math.min(Math.max(x+14, 10), W - r.width - 12);
  let py = Math.min(Math.max(y-30, 10), H - r.height - 12);
  el.style.left = px+'px'; el.style.top = py+'px';
  // click-away close
  const closer = ev => { if(!el.contains(ev.target)){ holder.innerHTML=''; document.removeEventListener('pointerdown', closer, true);} };
  setTimeout(()=>document.addEventListener('pointerdown', closer, true), 0);
}

function createGhostPage(ghostId){
  const g = GHOSTS.find(x=>x.id===ghostId);
  if(!g) return;
  PAGES.push({
    id: g.id, title: g.title, aliases: [], folder:'方法论', tags:['方法论'],
    created: new Date().toISOString().slice(0,10), updated:'刚刚',
    conf: 0.42, confF:{ freq:0.30, recency:1.0, revisions:0.10, citations:0.3 },
    blocks:[ {type:'p', text:'从虚链创建的空白页面。第一段从这里开始……'} ],
  });
  GHOSTS.splice(GHOSTS.indexOf(g),1);
  toast(`已创建页面「${g.title}」并接入图谱`);
  openPageTab(g.id);
}

              <div class="cf-row"><span class="k">被引数 <b>${p.confF.citations.toFixed(2)}</b></span><div class="cf-bar"><i style="width:${p.confF.citations*100}%"></i></div></div>
            </div>
            <div class="conf-note">由 Git 历史推导 · 参与召回重排（乘性因子 ×<b>${p.conf.toFixed(2)}</b>）· 仅在此呈现</div>
          </div>
        </div>

        <div class="yaml-src">${yaml.replace(/^---$/m,'<span style="color:var(--ink-low)">---</span>')

        <div class="conf-note" style="margin-top:8px">YAML 模式直接编辑源码，与表格模式双向同步 · 置信度为只读派生值，不落 frontmatter</div>
      `}
    </div>`;
  el.querySelectorAll('[data-pm]').forEach(b=>b.addEventListener('click',()=>{
    state.propsMode = b.dataset.pm; renderProps(pageId);
  }));

  }));

    const t = prompt('新标签（回车确认，双轨制：frontmatter 与 #内联 统一入索引）');
    if(t && t.trim()){ p.tags.push(t.trim()); toast(`已添加标签 #${t.trim()}`); renderProps(pageId); renderSidebar(); }
  });
}

// BLOCKS RENDER + EDITOR INTERACTIONS

function renderBlocks(pageId){
  const p = pageById(pageId);
  const wrap = $('#blocks');
  wrap.innerHTML = p.blocks.map((b,i)=> renderBlock(b,i,pageId)).join('');
}
function renderBlock(b,i,pageId){
  const id = b.id || `b${i}_${(Math.random().toString(36).slice(2,6))}`;
  b.id = id;
  let inner = '';
  if(b.type==='p') inner = `<div class="blk" contenteditable="true" spellcheck="false" data-block="${id}">${renderInline(b.text)}</div>`;
  else if(b.type==='h2') inner = `<div class="blk blk-h2" contenteditable="true" spellcheck="false" data-block="${id}">${renderInline(b.text)}</div>`;
  else if(b.type==='h3') inner = `<div class="blk blk-h3" contenteditable="true" spellcheck="false" data-block="${id}">${renderInline(b.text)}</div>`;
  else if(b.type==='list') inner = `<div class="blk" contenteditable="true" spellcheck="false" data-block="${id}"><ul>${b.items.map(x=>`<li>${renderInline(x)}</li>`).join('')}</ul></div>`;
  else if(b.type==='quote') inner = `<div class="blk" contenteditable="true" spellcheck="false" data-block="${id}"><blockquote>${renderInline(b.text)}</blockquote></div>`;
  else if(b.type==='code') inner = `<div class="codeblock" contenteditable="true" spellcheck="false" data-block="${id}"><span class="lang">${esc(b.lang||'text')}</span>${esc(b.text)}</div>`;
  else if(b.type==='callout') inner = `<div class="callout ${b.variant==='violet'?'violet':''}">
    <svg class="ic"><use href="#i-info"/></svg>
    <div><div class="co-title">${esc(b.head||'NOTE')}</div><div class="co-body blk" contenteditable="true" spellcheck="false" data-block="${id}">${renderInline(b.text)}</div></div>
  </div>`;
  else if(b.type==='table') inner = `<div class="blk" data-block="${id}">
    <table style="width:100%;border-collapse:collapse;margin:8px 0">
      <thead><tr style="border-bottom:1px solid var(--line-strong)">
        ${b.header.map(h=>`<th style="padding:6px 10px;text-align:left;font-size:12px;color:var(--ink-mid)">${esc(h)}</th>`).join('')}
      </tr></thead>
      <tbody>${b.rows.map(r=>`<tr style="border-bottom:1px dashed var(--line)">
        ${r.map(c=>`<td style="padding:5px 10px;font-size:12.6px">${esc(c)}</td>`).join('')}
      </tr>`).join('')}</tbody>
    </table></div>`;
  return `<div class="block" data-idx="${i}" data-block-id="${id}" draggable="false">
    <span class="block-handle" title="拖拽排序">${svg('i-grip')}</span>
    <span class="block-anchor" title="块 ID：^${id.slice(0,6)}">⌖</span>
    ${inner}
  </div>`;
}

function wireBlockEvents(pageId){
  const p = pageById(pageId);
  const wrap = $('#blocks');
  // wikilink click
  wrap.querySelectorAll('a.wl').forEach(a=>{
    a.addEventListener('click', ev=>{
      ev.preventDefault();
      const t = a.dataset.target;
      if(GHOSTS.find(g=>g.id===t)){
        // ghost link
        toast(`「${a.textContent}」尚未创建 · 点击创建`, 'warn');
        // show create preview card at position
        showGhostCreate(a, t);
      } else openPageTab(t);
    });
    a.addEventListener('mouseenter', ev=>{
      showLinkPeek(ev, a.dataset.target);
    });
    a.addEventListener('mouseleave', ()=>{
      const pk = $('#linkpeek');
      if(pk) pk.dataset.leave = '1';
      setTimeout(()=>{ const pk2=$('#linkpeek'); if(pk2 && pk2.dataset.leave==='1') pk2.remove(); }, 400);
    });
  });
  // block hover handle drag
  wrap.querySelectorAll('.block-handle').forEach(h=>{
    h.addEventListener('mousedown', ev=>{
      const blk = h.closest('.block');
      blk.draggable = true;
    });
    h.addEventListener('mouseup', ev=>{
      const blk = h.closest('.block');
      setTimeout(()=>{ blk.draggable = false; }, 50);
    });
  });
  wrap.querySelectorAll('.block').forEach(blk=>{
    blk.addEventListener('dragstart', ev=>{
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', blk.dataset.idx);
      ev.target.style.opacity = '.4';
    });
    blk.addEventListener('dragend', ev=>{
      ev.target.style.opacity = '1';
      wrap.querySelectorAll('.block').forEach(b=>b.classList.remove('drop-above','drop-below'));
      blk.draggable = false;
    });
    blk.addEventListener('dragover', ev=>{
      ev.preventDefault();
      const r = blk.getBoundingClientRect();
      const above = ev.clientY < r.top + r.height/2;
      blk.classList.toggle('drop-above', above);
      blk.classList.toggle('drop-below', !above);
    });
    blk.addEventListener('drop', ev=>{
      ev.preventDefault();
      const fromIdx = parseInt(ev.dataTransfer.getData('text/plain'));
      const toIdx = parseInt(blk.dataset.idx);
      if(isNaN(fromIdx) || fromIdx===toIdx) return;
      const blocks = p.blocks;
      const [moved] = blocks.splice(fromIdx,1);
      const r = blk.getBoundingClientRect();
      const above = ev.clientY < r.top + r.height/2;
      const insertAt = above ? toIdx : toIdx+1;
      const idx = fromIdx < toIdx ? insertAt-1 : insertAt;
      blocks.splice(idx, 0, moved);
      renderBlocks(pageId); wireBlockEvents(pageId);
      toast('块顺序已更新');
    });
    // input tracking for slash / wikilink popup
    const editable = blk.querySelector('[contenteditable]');
    if(!editable) return;
    editable.addEventListener('input', ()=>{
      const txt = editable.innerText;
      // very simple: if last char is / and empty-ish before, open slash menu
      const sel = window.getSelection();
      if(!sel.rangeCount) return;
      const r = sel.getRangeAt(0);
      const node = r.startContainer;
      if(node.nodeType!==3) return;
      const before = node.textContent.slice(0, r.startOffset);
      const slashMatch = before.match(/(^|\s)\/([\u4e00-\u9fa5\w]*)$/);
      if(slashMatch){ showSlashMenu(editable, slashMatch[2]); return; }
      const wlMatch = before.match(/\[\[([^\]]*)$/);
      if(wlMatch){ showWikilinkPopup(editable, wlMatch[1]); return; }
      hidePopmenus();
    });
    editable.addEventListener('keydown', ev=>{
      if(ev.key === 'Escape') { hidePopmenus(); }
      if(ev.key === 'Enter' && $('.popmenu')){ ev.preventDefault(); pickActivePopmenu(editable); }
      if(ev.key === 'ArrowDown' && $('.popmenu')){ ev.preventDefault(); movePopmenu(1); }
      if(ev.key === 'ArrowUp' && $('.popmenu')){ ev.preventDefault(); movePopmenu(-1); }
    });
    editable.addEventListener('blur', ()=>{
      setTimeout(()=>{
        if(!document.activeElement || !document.activeElement.closest('.popmenu')) hidePopmenus();
      }, 150);
    });
    // selection toolbar
    editable.addEventListener('mouseup', ()=>{
      setTimeout(checkSelection, 0);
    });
    editable.addEventListener('keyup', ()=>{ if(ev=>ev.key==='Shift') checkSelection(); });
  });
}

function checkSelection(){
  const sel = window.getSelection();
  const text = sel.toString().trim();
  const sb = $('#selbar');
  if(!text || text.length<2){ if(sb) sb.remove(); return; }
  const r = sel.getRangeAt(0).getBoundingClientRect();
  if(!sb){
    const el = document.createElement('div');
    el.id = 'selbar';
    el.innerHTML = `
      <button data-ai="改写" title="改写">${svg('i-wand')}改写</button>
      <button data-ai="润色" title="润色">✨ 润色</button>
      <span class="sep"></span>
      <button data-ai="扩写" title="扩写">扩写</button>
      <button data-ai="缩写" title="缩写">缩写</button>
      <button data-ai="补充论据" title="补充论据">补论据</button>
      <button data-ai="查漏补缺" title="查漏补缺">查漏</button>`;
    document.body.appendChild(el);
    el.querySelectorAll('button').forEach(b=>b.addEventListener('mousedown', ev=>{
      ev.preventDefault();
      runAiAction(sel.toString(), b.dataset.ai);
      el.remove();
    }));
  }
  const elb = $('#selbar');
  const rect = elb.getBoundingClientRect();
  const top = r.top - rect.height - 8 + window.scrollY;
  const left = r.left + r.width/2 - rect.width/2 + window.scrollX;
  elb.style.top = top + 'px';
  elb.style.left = Math.max(10, left) + 'px';
}

function runAiAction(text, action){
  // open diff modal with original vs rewritten
  const rewrites = {
    '改写': text + '（经 AI 改写，语言更凝练，结构更清晰；保留核心信息与论点。）',
    '润色': text + '——措辞更精准，节奏更流畅。',
    '扩写': text + '（扩写后的段落：补充了背景上下文，展开了论证细节，提供了具体案例支撑，使论述更充分。）',
    '缩写': text.slice(0, Math.floor(text.length*0.6)) + '……（已缩写至约六成）',
    '补充论据': text + '\n· 论据一：研究表明类似案例成功率提升 37%\n· 论据二：行业基准数据支持该结论',
    '查漏补缺': text + '\n\n**补充点**\n- 缺失的角度 A（建议加入）\n- 待验证的假设 B（需确认）',
  };
  const newText = rewrites[action] || text;
  showDiffModal(text, newText, `AI ${action}`, ()=>{
    // accept: replace selection
    const sel = window.getSelection();
    if(!sel.rangeCount) return;
    const r = sel.getRangeAt(0);
    r.deleteContents();
    // find block and update state
    const blockEl = r.startContainer.parentElement?.closest('[data-block]') || r.startContainer.parentElement?.closest('.block');
    const blockId = blockEl?.dataset?.block;
    if(blockId){
      const p = pageById(state.activePageId);
      const b = p.blocks.find(x=>x.id===blockId);
      if(b){
        // simple replace in b.text
        if(b.text) b.text = b.text.replace(sel.toString(), newText);
        renderBlocks(state.activePageId); wireBlockEvents(state.activePageId);
        toast(`AI ${action} 已应用`);
      }
    }
  });
}

function showDiffModal(orig, next, title, onAccept){

  m.innerHTML = `<div class="modal">
    <div class="modal-head">
      <h3>${svg('i-wand')}${esc(title)}<div class="sub">接受或拒绝此变更</div></h3>
      <button class="icon-btn" style="margin-left:auto" data-close>${svg('i-x')}</button>
    </div>
    <div class="modal-body diff-page">
      <div class="dhunk">
        <div class="dhunk-head"><span>原文</span><span class="sp" style="flex:1"></span><span class="fh">${orig.length} 字</span></div>
        <div class="dline del"><span class="ln">−</span><span class="sign">−</span><span>${esc(orig)}</span></div>
        <div class="dline add"><span class="ln">+</span><span class="sign">+</span><span>${esc(next)}</span></div>
      </div>
      <div class="dhunk">
        <div class="dhunk-head"><span>变更统计</span></div>
        <div style="padding:8px 12px;font-size:12px;color:var(--ink-mid)">
          <span style="color:var(--green)">+${next.length - orig.length>0?next.length-orig.length:0}</span>
          <span style="color:var(--red-soft);margin-left:10px">${orig.length - next.length>0?`−${orig.length-next.length}`:'−0'}</span>
          <span style="margin-left:10px;color:var(--ink-low)">此变更可撤销（Ctrl+Z）</span>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghosty" data-rej>拒绝</button>
      <span style="flex:1"></span>
      <button class="btn" data-acc>接受变更</button>

  </div>`;
  $('#overlay-root').appendChild(m);
  m.addEventListener('click', ev=>{
    if(ev.target === m || ev.target.closest('[data-close]') || ev.target.closest('[data-rej]')){ m.remove(); }
    if(ev.target.closest('[data-acc]')){ onAccept(); m.remove(); }
  });
}
// ============================================================
// SLASH MENU + WIKILINK POPUP + LINK PEEK
// ============================================================
let popSel = 0, popItems = [], popKind = null, popCtx = null;

function hidePopmenus(){
  $$('.popmenu').forEach(m=>m.remove());
  popItems=[]; popKind=null; popSel=0;
}
function showSlashMenu(editable, query){
  hidePopmenus();
  popKind='slash'; popCtx={editable};
  const blockTypes = [
    {t:'文本', ic:'i-edit', ds:'段落', act:()=>setBlockType(editable,'p')},
    {t:'标题 2', ic:'i-h1', ds:'H2', act:()=>setBlockType(editable,'h2')},
    {t:'标题 3', ic:'i-h1', ds:'H3', act:()=>setBlockType(editable,'h3')},
    {t:'列表', ic:'i-list', ds:'无序', act:()=>setBlockType(editable,'list')},
    {t:'引用', ic:'i-quote', ds:'blockquote', act:()=>setBlockType(editable,'quote')},
    {t:'代码块', ic:'i-code', ds:'code', act:()=>setBlockType(editable,'code')},
    {t:'表格', ic:'i-table', ds:'table', act:()=>setBlockType(editable,'table')},
  ];
  const aiActions = [
    {t:'改写', ds:'AI'}, {t:'扩写', ds:'AI'}, {t:'缩写', ds:'AI'},
    {t:'润色', ds:'AI'}, {t:'查漏补缺', ds:'AI'}, {t:'补充论据', ds:'AI'},
  ];
  const ft = query.toLowerCase();
  const items = [
    ...blockTypes.map(x=>({...x, grp:'块'})).filter(x=>x.t.toLowerCase().includes(ft)),
    ...aiActions.map(x=>({...x, grp:'AI 动作', ic:'i-spark', ai:true})).filter(x=>x.t.includes(ft)),
  ];
  if(!items.length){ hidePopmenus(); return; }
  popItems = items; popSel = 0;
  const rect = caretRect(editable) || editable.getBoundingClientRect();
  const m = document.createElement('div');
  m.className = 'popmenu';
  let lastGrp = '';
  m.innerHTML = items.map((x,i)=>{
    const grp = x.grp!==lastGrp ? `<div class="grp">${x.grp}</div>` : '';
    lastGrp = x.grp;
    return grp + `<div class="pm-item ${i===0?'sel':''}" data-pi="${i}">${svg(x.ic||'i-edit')}<span>${esc(x.t)}</span><span class="ds">${esc(x.ds||'')}</span></div>`;
  }).join('');
  positionPopmenu(m, rect);
  document.body.appendChild(m);
  m.querySelectorAll('.pm-item').forEach(it=>it.addEventListener('mousedown', ev=>{
    ev.preventDefault();
    pickPopmenu(editable, parseInt(it.dataset.pi));
  }));
}
function setBlockType(editable, type){
  const blockEl = editable.closest('[data-block]') || editable.closest('.block');
  const blockId = blockEl?.dataset?.block;
  const p = pageById(state.activePageId);
  const b = p.blocks.find(x=>x.id===blockId);
  const curText = editable.innerText.trim();
  if(b){
    if(type==='h2') { b.type='h2'; b.text=curText; }
    else if(type==='h3') { b.type='h3'; b.text=curText; }
    else if(type==='list') { b.type='list'; b.items=[curText||'新列表项']; }
    else if(type==='quote') { b.type='quote'; b.text=curText; }
    else if(type==='code') { b.type='code'; b.lang='ts'; b.text=curText; }
    else if(type==='table') { b.type='table'; b.header=['列 A','列 B']; b.rows=[['','']]; }
    else if(type==='p'){ b.type='p'; b.text=curText; }
    renderBlocks(state.activePageId); wireBlockEvents(state.activePageId);
  }
}
function showWikilinkPopup(editable, query){
  hidePopmenus();
  popKind='wikilink'; popCtx={editable, query};
  const ft = query.toLowerCase();
  const candidates = [
    ...PAGES.filter(p=>p.title.toLowerCase().includes(ft) || (p.aliases||[]).some(a=>a.toLowerCase().includes(ft)))
      .map(p=>({t:p.title, ds:p.folder+'/', ghost:false, id:p.id})),
    ...GHOSTS.filter(g=>g.title.toLowerCase().includes(ft)).map(g=>({t:g.title, ds:'未创建', ghost:true, id:g.id})),
    {t:query.trim()||'新页面', ds:'+ 新建页面', ghost:true, create:true},
  ];
  if(!candidates.length){ hidePopmenus(); return; }
  popItems = candidates; popSel=0;
  const rect = caretRect(editable) || editable.getBoundingClientRect();
  const m = document.createElement('div');
  m.className='popmenu';
  m.innerHTML = candidates.map((c,i)=>`<div class="pm-item ${i===0?'sel':''} ${c.ghost?'ghost':''}" data-pi="${i}">
    ${svg(c.ghost?'i-file':'i-link')}<span>${esc(c.t)}</span><span class="ds">${esc(c.ds)}</span></div>`).join('');
  positionPopmenu(m, rect);
  document.body.appendChild(m);
  m.querySelectorAll('.pm-item').forEach(it=>it.addEventListener('mousedown', ev=>{
    ev.preventDefault();
    pickPopmenu(editable, parseInt(it.dataset.pi));
  }));
}
function pickPopmenu(editable, idx){
  const item = popItems[idx];
  if(!item) return;
  const sel = window.getSelection();
  if(!sel.rangeCount){ hidePopmenus(); return; }
  const r = sel.getRangeAt(0);
  const node = r.startContainer;
  const before = node.textContent.slice(0, r.startOffset);
  if(popKind==='slash'){
    // remove "/query"
    node.textContent = before.replace(/(^|\s)\/([\u4e00-\u9fa5\w]*)$/, '$1') + node.textContent.slice(r.startOffset);
    hidePopmenus();
    item.act && item.act();
    return;
  }
  if(popKind==='wikilink'){
    const name = item.create ? (item.t==='新页面'? item.t : item.t) : item.t;
    // replace "[[query" with "[[name]]"
    const start = before.lastIndexOf('[[');
    node.textContent = before.slice(0,start) + `[[${name}]] ` + node.textContent.slice(r.startOffset);
    hidePopmenus();
    // if creating a new ghost page
    if(item.create || item.ghost){
      let g = GHOSTS.find(x=>x.title===name);
      if(!g && item.create){
        g = {id:'ghost_'+Date.now().toString(36), title:name, firstSeen: state.activePageId};
        GHOSTS.push(g);
        toast(`虚链「${name}」已创建（点击链接可生成页面）`, 'warn');
      }
    }
    // re-render block
    const blockEl = editable.closest('[data-block]');
    if(blockEl){
      const p = pageById(state.activePageId);
      const b = p.blocks.find(x=>x.id===blockEl.dataset.block);
      if(b && b.type==='p') b.text = editable.innerText;
      renderBlocks(state.activePageId); wireBlockEvents(state.activePageId);
    }
  }
}
function pickActivePopmenu(editable){ pickPopmenu(popCtx?.editable || editable, popSel); }
function movePopmenu(dir){
  const items = $$('.pm-item');
  if(!items.length) return;
  items[popSel]?.classList.remove('sel');
  popSel = (popSel + dir + items.length) % items.length;
  items[popSel]?.classList.add('sel');
}
function caretRect(editable){
  const sel = window.getSelection();
  if(!sel.rangeCount) return null;
  const r = sel.getRangeAt(0).cloneRange();
  const rect = r.getBoundingClientRect();
  if(rect.width===0 && rect.height===0){
    const er = editable.getBoundingClientRect();
    return {top: er.top, left: er.left + 20, bottom: er.bottom};
  }
  return rect;
}
function positionPopmenu(m, rect){
  m.style.position = 'fixed';
  m.style.top = Math.min(rect.bottom + 6, window.innerHeight - 300) + 'px';
  m.style.left = Math.min(rect.left, window.innerWidth - 300) + 'px';
}

// link hover peek card
let peekTimer = null;
function showLinkPeek(ev, targetId){
  clearTimeout(peekTimer);
  const old = $('#linkpeek'); if(old) old.remove();
  const tp = pageById(targetId);
  if(!tp) return;
  const isGhost = !!tp.firstSeen;
  const el = document.createElement('div');
  el.id='linkpeek';
  const snippet = isGhost ? '此页面尚未创建。' :
    (tp.blocks.find(b=>b.type==='p')?.text || tp.blocks[0]?.text || '').slice(0,110);
  el.innerHTML = `

function renderSidebarResults(){
  let holder = $('#search-results');
  if(!holder){
    holder = document.createElement('div');
    holder.id='search-results';
    $('#sb-body').appendChild(holder);
  }
  const q = state.searchQuery.trim();
  if(!q){ holder.innerHTML='<div style="padding:14px;color:var(--ink-low);font-size:11.5px">搜索标题、别名、标签与块级内容（FTS5）</div>'; return; }
  const hits = [];
  for(const p of PAGES){
    if(p.title.includes(q)) hits.push({p, where:'标题', snip:p.title});
    if((p.aliases||[]).some(a=>a.includes(q))) hits.push({p, where:'别名', snip:p.aliases.find(a=>a.includes(q))});
    if(p.tags.some(t=>t.includes(q))) hits.push({p, where:'标签', snip:'#'+p.tags.find(t=>t.includes(q))});
    for(const b of p.blocks){
      const txt = b.text || b.head || (b.items||[]).join(' ');
      if(txt && txt.includes(q)){
        const i = txt.indexOf(q);
        const snip = txt.slice(Math.max(0,i-16), i+40);
        hits.push({p, where:b.type==='h2'||b.type==='h3'?'标题块':'块级', snip, blockId:b.id});
        break;
      }
    }
  }
  const uniq = [...new Map(hits.map(h=>[h.p.id+(h.blockId||''),h])).values()];
  holder.innerHTML = `<div class="sb-sec">${uniq.length} 命中</div>` +
    (uniq.length ? uniq.map(h=>`
      <div class="bl-item" data-jump="${h.p.id}">
        <div class="bl-title">${svg('i-file')}${esc(h.p.title)}<span class="bl-flag" style="color:var(--teal)">${h.where}</span></div>
        <div class="bl-snip">${esc(h.snip).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'), m=>`<mark>${m}</mark>`)}</div>
      </div>`).join('')
    : '<div style="padding:14px;color:var(--ink-low);font-size:12px">无命中</div>');
  holder.querySelectorAll('[data-jump]').forEach(el=>el.addEventListener('click',()=>openPageTab(el.dataset.jump)));
}

function renderRecall(rc){
  const mkStage = (name, idx, count, enabled) => {
    // idx: 0,1,2 — stage complete when the corresponding count field is set
    const vals = [rc.s1, rc.s2, rc.s3];
    let doneUpTo = -1;
    for(let i=0;i<vals.length;i++) if(vals[i] != null) doneUpTo = i;
    let cls = '';
    if(enabled === false) cls = '';
    else if(idx <= doneUpTo) cls = 'done';
    else if(idx === doneUpTo + 1) cls = 'run';
    return `<div class="rstage ${cls}">
      <span class="st-dot"></span><span>${esc(name)}</span>
      ${vals[idx]!=null?`<span class="cnt">${vals[idx]} 命中</span>`: cls==='run'?'<span class="cnt" style="color:var(--teal)">…</span>':''}
    </div>`;
  };
  return `<div class="recall">
    <div class="rt">${svg('i-target')}渐进式召回 · ${rc.status||'进行中…'}</div>
    ${mkStage('阶段一 · 全文粗筛', 0, rc.s1, state.skillsOn.fulltext)}
    ${mkStage('阶段二 · 关系扩展', 1, rc.s2, state.skillsOn.relExpand)}
    ${mkStage('阶段三 · 向量重排', 2, rc.s3, state.skillsOn.vector)}
    ${rc.confFactor?`<div style="font-size:10.5px;color:var(--ink-low);margin-top:6px">置信度重排因子 ×<b style="color:var(--amber);font-family:var(--font-mono)">${rc.confFactor}</b>（仅后端）</div>`:''}
  </div>`;
}

function sendAiMessage(){
  const input = $('#ai-input');
  const q = input.value.trim();
  if(!q) return;
  state.aiMsgs.push({role:'user', content:q});
  // loading ai msg with staged recall
  const mi = state.aiMsgs.length;
  const aiMsg = {
    role:'ai',
    content:'',
    loading:true,
    recall: { status:'进行中…', s1:null, s2:null, s3:null, confFactor: null },
    sources: null,
  };
  state.aiMsgs.push(aiMsg);
  renderDock();
  // staged animation
  setTimeout(()=>{
    aiMsg.recall.s1 = 28;
    aiMsg.recall.stage1done = true;
    renderDock();
  }, 600);
  setTimeout(()=>{
    aiMsg.recall.s2 = 12;
    renderDock();
  }, 1200);
  setTimeout(()=>{
    aiMsg.recall.s3 = 6;
    aiMsg.recall.confFactor = '0.87';
    aiMsg.recall.status = '完成';
    aiMsg.sources = [
      {id:'rec', title:'渐进式召回', stage:1, dist:'#0.21', snip:'三阶段召回管道：粗筛 → 关系扩展 → 向量重排……'},
      {id:'skill', title:'检索 Skill 设计', stage:2, dist:'#0.35', snip:'检索 Skill 是受约束的插件——同运行时同权限面……'},
      {id:'vec', title:'向量检索', stage:3, dist:'0.42', snip:'MVP 采用 sqlite-vec 作为向量检索引擎……'},
      {id:'conf', title:'置信度模型', stage:3, dist:'0.51', snip:'由 Git 提交历史推导的文档可信分数……'},
    ];
    renderDock();
    // wire source expand + click
    $$('.sources .sh').forEach(sh=>sh.addEventListener('click',()=>{
      const s = sh.closest('.sources');
      const list = s.querySelector('.src-list');
      s.classList.toggle('open');
      list.style.display = s.classList.contains('open') ? 'block' : 'none';
    }));
    $$('.sources [data-jump]').forEach(el=>el.addEventListener('click',()=>openPageTab(el.dataset.jump)));
    // stream answer
    const answer = `<p>关于"${esc(q)}"，结合当前上下文与召回结果，我整理如下：</p>
      <p><strong>核心结论：</strong>渐进式召回的三阶段管道能在知识库规模下平衡速度与精度——第一阶段 FTS5 粗筛保证毫秒级响应，第二阶段沿图谱关系扩展覆盖邻域，第三阶段向量重排引入语义相关性。</p>
      <p><strong>值得关注：</strong>置信度作为重排乘性因子，把 Git 历史的"编辑可信度"注入排序，这是 NexNote 区别于普通笔记软件的地方。</p>
      <p>需要我进一步展开哪一部分？</p>`;
    let i=0;
    const timer = setInterval(()=>{
      i += 4;
      aiMsg.content = answer.slice(0,i);
      renderDock();
      if(i >= answer.length){
        clearInterval(timer);
        aiMsg.loading = false;
        renderDock();
      }
    }, 22);
  }, 1900);
  input.value = '';
}

function openPalette(){
  state.paletteOpen = true;
  const groups = [
    {g:'页面', items: PAGES.map(p=>({t:p.title, ic:'i-file', d:p.folder+'/', k:'⏎', act:()=>{closePalette(); openPageTab(p.id);}}))},

      {t:'打开全局图谱', ic:'i-graph', d:'视图', k:'⌘⇧G', act:()=>{closePalette(); openGraphTab();}},
      {t:'切换 AI dock', ic:'i-spark', d:'显示/隐藏', k:'⌘\\', act:()=>{closePalette(); toggleDock();}},
      {t:'打开时间线', ic:'i-history', d:'当前页面', k:'⌘⌥H', act:()=>{closePalette(); openTimeline(state.activePageId);}},
      {t:'打开设置', ic:'i-sliders', d:'Skill / 插件', k:'⌘,', act:()=>{closePalette(); openSettings();}},
    ]},
    {g:'AI 动作', items:[
      {t:'总结本页', ic:'i-spark', d:'当前页面', act:()=>{closePalette(); toast('AI 已总结本页（示意）');}},
      {t:'查漏补缺', ic:'i-wand', d:'分析当前页', act:()=>{closePalette(); toast('AI 已生成补充点（示意）');}},
      {t:'生成关联问题', ic:'i-target', d:'反向启发', act:()=>{closePalette(); toast('AI 已生成 5 个关联问题（示意）');}},
    ]},
  ];
  const m = document.createElement('div');
  m.id='palette-scrim'; m.className='scrim';
  m.innerHTML = `<div class="palette">
    <div class="pal-input">${svg('i-search')}<input id="pal-input" placeholder="搜索页面、命令、AI 动作…"></div>
    <div class="pal-list" id="pal-list">
      ${groups.map(grp=>`
        <div class="pal-group">${grp.g}</div>
        ${grp.items.map((x,i)=>`<div class="pal-item" data-g="${grp.g}" data-i="${i}">${svg(x.ic)}<span>${esc(x.t)}</span><span style="color:var(--ink-low);font-size:11px;margin-left:8px">${esc(x.d||'')}</span>${x.k?`<span class="k">${x.k}</span>`:''}</div>`).join('')}
      `).join('')}
    </div>
  </div>`;
  document.body.appendChild(m);
  const input = m.querySelector('#pal-input');
  input.focus();
  let sel = 0, allItems = [];
  const updateList = () => {
    const q = input.value.trim().toLowerCase();
    let idx = 0; allItems = [];
    let html = '';
    for(const grp of groups){
      const its = grp.items.filter(x=>x.t.toLowerCase().includes(q));
      if(!its.length) continue;
      html += `<div class="pal-group">${grp.g}</div>`;
      for(const x of its){
        html += `<div class="pal-item ${idx===0?'sel':''}" data-idx="${idx}">${svg(x.ic)}<span>${esc(x.t)}</span><span style="color:var(--ink-low);font-size:11px;margin-left:8px">${esc(x.d||'')}</span>${x.k?`<span class="k">${x.k}</span>`:''}</div>`;
        allItems.push(x);
        idx++;
      }
    }
    sel = 0;
    m.querySelector('#pal-list').innerHTML = html || '<div style="padding:14px;color:var(--ink-low);font-size:12px">无匹配</div>';
    m.querySelectorAll('.pal-item').forEach(it=>it.addEventListener('click',()=>{
      const i = parseInt(it.dataset.idx);
      allItems[i]?.act?.();
    }));
  };
  updateList();
  input.addEventListener('input', updateList);
  input.addEventListener('keydown', ev=>{
    const items = m.querySelectorAll('.pal-item');
    if(ev.key==='Escape') closePalette();
    else if(ev.key==='ArrowDown'){ ev.preventDefault(); items[sel]?.classList.remove('sel'); sel=Math.min(sel+1, items.length-1); items[sel]?.classList.add('sel'); const pl = m.querySelector('#pal-list'); if(items[sel]) pl.scrollTop = items[sel].offsetTop - pl.clientHeight/2; }
    else if(ev.key==='ArrowUp'){ ev.preventDefault(); items[sel]?.classList.remove('sel'); sel=Math.max(sel-1,0); items[sel]?.classList.add('sel'); const pl = m.querySelector('#pal-list'); if(items[sel]) pl.scrollTop = items[sel].offsetTop - pl.clientHeight/2; }
    else if(ev.key==='Enter'){ ev.preventDefault(); allItems[sel]?.act?.(); }
  });
  m.addEventListener('click', ev=>{ if(ev.target===m) closePalette(); });
}
