packages:
  - 'packages/*'

# 允许执行安装脚本的依赖（pnpm v10+ 安全机制）
onlyBuiltDependencies:
  - electron
  - esbuild
  - electron-winstaller
  - electron-builder
  - better-sqlite3
allowBuilds:
  better-sqlite3: true
  electron-winstaller: true
  esbuild: true
minimumReleaseAgeExclude:
  - lucide-react@1.41.0

overrides:
  '@electron/get': 5.1.0
